name: EH7 v7.4.0 Isolated Backup Restore UAT

on:
  workflow_dispatch:
  push:
    branches: [codex/erp735-document-integration, codex/reports-date-export-workflow]

permissions:
  contents: read

jobs:
  isolated-backup-restore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-backup-restore-uat]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Add verified Git Bash utilities to PATH
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $gitBin = 'C:\Program Files\Git\bin'
          $gitUsrBin = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash executable is missing from the self-hosted Windows runner.'
          }
          if (-not (Test-Path -LiteralPath $gitUsrBin -PathType Container)) {
            throw 'Git Unix utility directory is missing from the self-hosted Windows runner.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $gitBin
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $gitUsrBin

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info
          curl --version
          jq --version

      - name: Fresh isolated WordPress + MariaDB backup/restore drill
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/isolated-backup-restore-uat.sh
          .github/scripts/isolated-backup-restore-uat.sh

      - name: Upload backup/restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EH7-v7.4.0-Isolated-Backup-Restore-Evidence
          path: |
            dist/isolated-backup-restore/EVIDENCE.json
            dist/isolated-backup-restore/bootstrap.json
          if-no-files-found: warn
