name: EH7 Apply Web Runtime Patch

on:
  push:
    branches: [v740-web-readiness]
    paths:
      - '.github/workflows/eh7-apply-web-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Apply exact patch
        run: python3 scripts/patch_web_runtime.py

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format
        working-directory: flutter-app
        run: dart format lib/core/api_client.dart lib/core/gps_tracking_service.dart lib/screens/tools/erp_tools_screen.dart lib/screens/my_work/my_work_screen.dart lib/shell/app_shell.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build Web
        working-directory: flutter-app
        run: >-
          flutter build web --release
          --base-href /wp-content/uploads/eh7-flutter-web/
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eh7-apply-web-runtime-patch.yml scripts/patch_web_runtime.py
          git add flutter-app/lib/core/api_client.dart flutter-app/lib/core/gps_tracking_service.dart flutter-app/lib/screens/tools/erp_tools_screen.dart flutter-app/lib/screens/my_work/my_work_screen.dart flutter-app/lib/shell/app_shell.dart
          git commit -m "Add browser-safe ERP runtime support"
          git push origin HEAD:v740-web-readiness
