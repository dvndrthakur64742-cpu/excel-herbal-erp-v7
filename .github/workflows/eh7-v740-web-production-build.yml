name: EH7 v7.4.0 Web Production Build

on:
  workflow_dispatch:
  push:
    branches: [v740-business-completion]
    paths:
      - '.github/workflows/eh7-v740-web-production-build.yml'
      - 'flutter-app/**'

concurrency:
  group: eh7-v740-web-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  web-production:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Enable Windows long paths for runner Git
        run: git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce approved production release gates
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & '.github/scripts/verify-release-gates.ps1' -Mode production -GateFile 'release-gates/v7.4.0.json'

      - name: Verify runner is installed as a Windows service
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $services = @(Get-Service 'actions.runner.*' -ErrorAction SilentlyContinue)
          if ($services.Count -eq 0) { throw 'Production web runner must be installed as a Windows service.' }
          if (-not ($services | Where-Object Status -eq 'Running')) { throw 'Production web runner Windows service is not running.' }
          $services | Select-Object Name,Status,StartType | Format-Table -AutoSize

      - name: Bootstrap Flutter 3.44.9 from persistent cache
        run: |
          set CACHE=C:\actions-runner\eh7-toolcache
          set FLUTTERZIP=C:\actions-runner\eh7-toolcache\flutter_windows_3.44.9-stable.zip
          set FLUTTERROOT=C:\actions-runner\eh7-toolcache\flutter-3.44.9
          if not exist "%CACHE%" mkdir "%CACHE%"
          if exist "%FLUTTERROOT%\flutter\bin\flutter.bat" goto flutter_ready
          if exist "%FLUTTERZIP%.complete" goto flutter_downloaded
          curl.exe -fL -C - --retry 100 --retry-all-errors --retry-delay 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.9-stable.zip" -o "%FLUTTERZIP%"
          if errorlevel 1 exit /b 1
          echo complete>"%FLUTTERZIP%.complete"
          :flutter_downloaded
          if exist "%FLUTTERROOT%" rmdir /s /q "%FLUTTERROOT%"
          mkdir "%FLUTTERROOT%"
          tar.exe -xf "%FLUTTERZIP%" -C "%FLUTTERROOT%"
          if errorlevel 1 exit /b 1
          :flutter_ready
          git config --global --add safe.directory "%FLUTTERROOT%\flutter"
          echo %FLUTTERROOT%\flutter\bin>>"%GITHUB_PATH%"
          "%FLUTTERROOT%\flutter\bin\flutter.bat" --version
          "%FLUTTERROOT%\flutter\bin\flutter.bat" config --no-analytics
          "%FLUTTERROOT%\flutter\bin\flutter.bat" config --enable-web

      - name: Dependencies
        working-directory: flutter-app
        run: flutter.bat pub get

      - name: Verify pinned dependency lockfile
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: flutter-app
        run: |
          git diff -- pubspec.lock
          git diff --quiet -- pubspec.lock
          if ($LASTEXITCODE -ne 0) { throw 'pubspec.lock drifted under pinned Flutter 3.44.9.' }

      - name: Analyze clean source
        working-directory: flutter-app
        run: flutter.bat analyze

      - name: Test
        working-directory: flutter-app
        run: flutter.bat test

      - name: Build production desktop web
        working-directory: flutter-app
        run: |
          set WEB_TRY=0
          :retry_web
          set /a WEB_TRY+=1
          echo Production web build attempt %WEB_TRY% of 3
          call flutter.bat build web --release --base-href /wp-content/uploads/eh7-flutter-web/ --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 --dart-define=EH7_ENVIRONMENT=production
          if not errorlevel 1 goto web_ok
          if %WEB_TRY% GEQ 3 exit /b 1
          timeout /t 10 /nobreak >nul
          goto retry_web
          :web_ok
          echo Production web build completed.

      - name: Verify production web invariants
        run: |
          if not exist "flutter-app\build\web\index.html" exit /b 1
          if not exist "flutter-app\build\web\flutter_bootstrap.js" exit /b 1
          if not exist "flutter-app\build\web\main.dart.js" exit /b 1
          findstr /c:"<base href=\"/wp-content/uploads/eh7-flutter-web/\">" "flutter-app\build\web\index.html" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"<html lang=\"en\">" "flutter-app\build\web\index.html" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"Excel Herbal ERP operations portal" "flutter-app\build\web\index.html" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"office.excelherbal.in/wp-json/excel-herbal-erp/v7" "flutter-app\build\web\main.dart.js" >nul
          if errorlevel 1 exit /b 1
          findstr /c:"UAT BUILD" "flutter-app\build\web\main.dart.js" >nul
          if not errorlevel 1 exit /b 1
          echo Production web invariants verified.
          exit /b 0

      - name: Persist and package production web
        run: |
          set RELEASE_ROOT=%USERPROFILE%\ERP7-Releases\v7.4.0
          set WEB_RELEASE_DIR=%USERPROFILE%\ERP7-Releases\v7.4.0\web-production
          set WEB_ZIP=%USERPROFILE%\ERP7-Releases\v7.4.0\Excel-Herbal-ERP-v7.4.0-Web-Production.zip
          if not exist "%RELEASE_ROOT%" mkdir "%RELEASE_ROOT%"
          if exist "%WEB_RELEASE_DIR%" rmdir /s /q "%WEB_RELEASE_DIR%"
          mkdir "%WEB_RELEASE_DIR%"
          xcopy /e /i /y "flutter-app\build\web\*" "%WEB_RELEASE_DIR%\" >nul
          if exist "%WEB_ZIP%" del /q "%WEB_ZIP%"
          tar.exe -a -c -f "%WEB_ZIP%" -C "%WEB_RELEASE_DIR%" .
          if errorlevel 1 exit /b 1
          if not exist "%WEB_ZIP%" exit /b 1
          certutil -hashfile "%WEB_RELEASE_DIR%\main.dart.js" SHA256 > "%RELEASE_ROOT%\WEB-PRODUCTION-MAIN-SHA256.txt"
          certutil -hashfile "%WEB_ZIP%" SHA256 > "%RELEASE_ROOT%\WEB-PRODUCTION-ZIP-SHA256.txt"
          type "%RELEASE_ROOT%\WEB-PRODUCTION-MAIN-SHA256.txt"
          type "%RELEASE_ROOT%\WEB-PRODUCTION-ZIP-SHA256.txt"

      - name: Stage workflow artifact
        run: |
          if not exist "dist\flutter-v7.4.0" mkdir "dist\flutter-v7.4.0"
          copy /y "%USERPROFILE%\ERP7-Releases\v7.4.0\Excel-Herbal-ERP-v7.4.0-Web-Production.zip" "dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Web-Production.zip"
          copy /y "%USERPROFILE%\ERP7-Releases\v7.4.0\WEB-PRODUCTION-MAIN-SHA256.txt" "dist\flutter-v7.4.0\WEB-PRODUCTION-MAIN-SHA256.txt"
          copy /y "%USERPROFILE%\ERP7-Releases\v7.4.0\WEB-PRODUCTION-ZIP-SHA256.txt" "dist\flutter-v7.4.0\WEB-PRODUCTION-ZIP-SHA256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Excel-Herbal-ERP-v7.4.0-Web-Production
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Web-Production.zip
            dist/flutter-v7.4.0/WEB-PRODUCTION-MAIN-SHA256.txt
            dist/flutter-v7.4.0/WEB-PRODUCTION-ZIP-SHA256.txt
          if-no-files-found: error
