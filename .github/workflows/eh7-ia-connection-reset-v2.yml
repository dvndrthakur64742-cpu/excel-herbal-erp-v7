name: EH7 IA Connection Reset v2

on:
  push:
    branches: [v740-ia-connection-reset]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v740-ia-connection-reset
          fetch-depth: 0

      - name: Apply connection reset patch
        run: python3 ci/run_ia_connection_reset_v2.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Format intended Dart files
        working-directory: flutter-app
        run: >-
          dart format
          lib/shell/app_shell.dart
          lib/screens/home/home_screen.dart
          lib/screens/my_work/my_work_screen.dart
          lib/screens/sales/sales_screen.dart
          lib/screens/inventory/inventory_screen.dart
          lib/screens/purchase/purchase_screen.dart
          lib/screens/finance/finance_screen.dart

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore generated tracked files
        run: |
          git restore -- flutter-app/android flutter-app/pubspec.lock || true

      - name: Remove one-shot validation machinery
        run: |
          rm -f ci/ia_connection_reset.py ci/run_ia_connection_reset_v2.py
          rm -f .github/workflows/eh7-ia-connection-reset.yml
          rm -f .github/workflows/eh7-ia-connection-reset-v2.yml

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            flutter-app/lib/shell/app_shell.dart \
            flutter-app/lib/screens/home/home_screen.dart \
            flutter-app/lib/screens/my_work/my_work_screen.dart \
            flutter-app/lib/screens/sales/sales_screen.dart \
            flutter-app/lib/screens/inventory/inventory_screen.dart \
            flutter-app/lib/screens/purchase/purchase_screen.dart \
            flutter-app/lib/screens/finance/finance_screen.dart \
            ci/ia_connection_reset.py \
            ci/run_ia_connection_reset_v2.py \
            .github/workflows/eh7-ia-connection-reset.yml \
            .github/workflows/eh7-ia-connection-reset-v2.yml
          allowed='^(flutter-app/lib/shell/app_shell\.dart|flutter-app/lib/screens/home/home_screen\.dart|flutter-app/lib/screens/my_work/my_work_screen\.dart|flutter-app/lib/screens/sales/sales_screen\.dart|flutter-app/lib/screens/inventory/inventory_screen\.dart|flutter-app/lib/screens/purchase/purchase_screen\.dart|flutter-app/lib/screens/finance/finance_screen\.dart|ci/ia_connection_reset\.py|ci/run_ia_connection_reset_v2\.py|\.github/workflows/eh7-ia-connection-reset\.yml|\.github/workflows/eh7-ia-connection-reset-v2\.yml)$'
          bad=$(git diff --cached --name-only | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected staged paths:"
            echo "$bad"
            exit 1
          fi
          git diff --cached --check -- flutter-app/lib
          git commit -m "Connect ERP navigation and quick actions"
          git push origin HEAD:v740-ia-connection-reset
