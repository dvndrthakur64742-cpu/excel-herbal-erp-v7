name: EH7 v7.4 P0 Logic Stabilization

on:
  push:
    branches: [v740-p0-logic-stabilization]
    paths:
      - 'ci/p0_logic_stabilize.py'
      - '.github/workflows/eh7-v740-p0-logic-stabilize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v740-p0-logic-stabilization
          fetch-depth: 0

      - name: Apply P0 logic patch
        run: python3 ci/p0_logic_stabilize.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format
        working-directory: flutter-app
        run: dart format lib test

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Remove one-shot patch machinery
        run: |
          rm -f ci/p0_logic_stabilize.py
          rm -f .github/workflows/eh7-v740-p0-logic-stabilize.yml
          rmdir ci 2>/dev/null || true

      - name: Commit validated P0 stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Stabilize v7.4 P0 workflow logic"
          git push origin HEAD:v740-p0-logic-stabilization
