name: EH7 Flutter v7.4.0 Stabilization Build

on:
  workflow_dispatch:

concurrency:
  group: eh7-v740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify hierarchy/reporting/GPS frontend invariants
        working-directory: flutter-app
        run: python3 tool/finalize_hierarchy_gps_frontend.py

      - name: Verify branch selector state sync
        working-directory: flutter-app
        run: python3 tool/verify_branch_selector_state_sync.py

      - name: Verify Flutter API paths against v7 backend
        working-directory: flutter-app
        run: python3 tool/verify_api_paths_against_backend.py

      - name: Install verified Flutter 3.44.9 stable
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/flutter_linux_3.44.9-stable.tar.xz"
          SDK_DIR="$RUNNER_TEMP/flutter-sdk"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$ARCHIVE" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz
          echo "a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb  $ARCHIVE" | sha256sum --check --status
          mkdir -p "$SDK_DIR"
          tar -xf "$ARCHIVE" -C "$SDK_DIR"
          git config --global --add safe.directory "$SDK_DIR/flutter"
          echo "$SDK_DIR/flutter/bin" >> "$GITHUB_PATH"
          "$SDK_DIR/flutter/bin/flutter" --version
          "$SDK_DIR/flutter/bin/flutter" config --no-analytics

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=flutter-app/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          mkdir -p dist/flutter-v7.4.0
          cp "$APK" dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
          sha256sum dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk | tee dist/flutter-v7.4.0/APK-SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error
