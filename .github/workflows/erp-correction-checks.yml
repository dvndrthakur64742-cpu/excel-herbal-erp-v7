name: ERP correction verification

on:
  push:
    branches: [codex/erp735-document-integration]
  pull_request:
    branches: [v740-business-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify PHP runtime and required extensions
        run: |
          set -euo pipefail
          php --version
          php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
          php -m | grep -qi '^openssl$'
          php -m | grep -qi '^fileinfo$'

      - name: PHP lint and 24 regression cases
        working-directory: backend/excel-herbal-erp-v7
        run: |
          set -euo pipefail
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l excel-herbal-erp-v7.php
          php tests/regression.php

      - name: Route and contract checks
        run: |
          set -euo pipefail
          python3 --version
          python3 backend/excel-herbal-erp-v7/tests/static_checks.py

  flutter-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: 3.44.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Flutter SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          sdk_root="$RUNNER_TEMP/flutter-sdk"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          mkdir -p "$sdk_root"
          tar -xf "$archive" -C "$sdk_root"
          echo "$sdk_root/flutter/bin" >> "$GITHUB_PATH"
          "$sdk_root/flutter/bin/flutter" config --no-analytics
          "$sdk_root/flutter/bin/flutter" config --enable-web
          "$sdk_root/flutter/bin/flutter" --version

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze

      - name: Tests
        working-directory: flutter-app
        run: flutter test

      - name: Development web compile
        working-directory: flutter-app
        run: >-
          flutter build web --release
          --base-href /wp-content/uploads/eh7-flutter-web/
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=development
