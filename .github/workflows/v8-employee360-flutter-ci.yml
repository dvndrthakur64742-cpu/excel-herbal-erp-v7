name: Excel Herbal Employee 360 and Branch Reports Flutter UI Tests (No Deploy)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter-app/lib/screens/organization/employee_360_screen.dart'
      - 'flutter-app/lib/screens/reports/reports_screen.dart'
      - 'flutter-app/lib/core/api_paths.dart'
      - 'flutter-app/test/branch_daily_control_ui_contract_test.dart'
      - 'flutter-app/test/branch_period_control_ui_contract_test.dart'
      - 'flutter-app/test/branch_comparison_csv_ui_contract_test.dart'
      - 'backend/excel-herbal-erp-v7/src/Organization/Employee360PersonLedger.php'
      - 'flutter-app/test/employee_360_ui_contract_test.dart'
      - 'flutter-app/pubspec.yaml'
      - '.github/workflows/v8-employee360-flutter-ci.yml'

permissions:
  contents: read

jobs:
  employee360-flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        working-directory: flutter-app
        run: flutter pub get
      - name: Employee 360 UI contract test
        working-directory: flutter-app
        run: flutter test test/employee_360_ui_contract_test.dart
      - name: Branch Daily Control report Flutter UI contract and compile
        working-directory: flutter-app
        run: flutter test test/branch_daily_control_ui_contract_test.dart
      - name: Branch Weekly Monthly Control Flutter UI contract and compile
        working-directory: flutter-app
        run: flutter test test/branch_period_control_ui_contract_test.dart
      - name: Regional multi branch comparison and CSV export Flutter contract
        working-directory: flutter-app
        run: flutter test test/branch_comparison_csv_ui_contract_test.dart
      - name: Stock allocation regression
        working-directory: flutter-app
        run: flutter test test/stock_allocation_test.dart
