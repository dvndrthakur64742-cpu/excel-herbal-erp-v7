name: ERP V7 Flutter UAT Quality Gates

on:
  pull_request:
    paths:
      - 'flutter-app/**'
      - '.github/workflows/erp-v7-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eh7-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Check Flutter version
        run: flutter --version
      - name: Resolve packages
        working-directory: flutter-app
        run: flutter pub get
      - name: Analyze Dart
        working-directory: flutter-app
        run: flutter analyze --no-pub
      - name: Link canonical PHP plugin for cross-module contract tests
        run: |
          test -d plugin/excel-herbal-erp-v7
          mkdir -p backend
          ln -s ../plugin/excel-herbal-erp-v7 backend/excel-herbal-erp-v7
      - name: Run Flutter tests
        working-directory: flutter-app
        run: flutter test --no-pub
      - name: Compile isolated UAT Web build (never production)
        working-directory: flutter-app
        run: >
          flutter build web --release
          --dart-define=EH7_ENVIRONMENT=uat
          --dart-define=EH7_API_BASE_URL=https://wordpress-uat-production.up.railway.app/wp-json/excel-herbal-erp/v7
      - name: Assert web build has UAT target, not live server
        run: |
          test -f flutter-app/build/web/main.dart.js
          grep -q 'wordpress-uat-production.up.railway.app' flutter-app/build/web/main.dart.js
          if grep -q 'eh7_live_credentials' flutter-app/build/web/main.dart.js; then
            echo 'Unsafe credential marker found in web bundle'; exit 1
          fi
          (cd flutter-app/build/web && sha256sum index.html main.dart.js > SHA256SUMS.txt)
      - name: Upload UAT-only Web candidate
        uses: actions/upload-artifact@v4
        with:
          name: eh7-flutter-web-uat-review
          path: flutter-app/build/web/
          if-no-files-found: error
          retention-days: 14
