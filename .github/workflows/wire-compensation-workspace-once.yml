name: Wire compensation workspace once

on:
  push:
    branches: [v740-business-completion]
    paths:
      - '.github/workflows/wire-compensation-workspace-once.yml'
      - '.github/patches/wire-compensation-workspace.patch'

permissions:
  contents: write

defaults:
  run:
    shell: cmd

jobs:
  wire-compensation:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v740-business-completion

      - name: Apply deterministic source patch
        run: |
          git apply --check .github\patches\wire-compensation-workspace.patch
          git apply .github\patches\wire-compensation-workspace.patch

      - name: Verify patch contract
        run: |
          findstr /c:"import 'compensation_workspace.dart';" flutter-app\lib\screens\performance\performance_screen.dart >nul || exit /b 1
          findstr /c:"const CompensationWorkspace()" flutter-app\lib\screens\performance\performance_screen.dart >nul || exit /b 1
          findstr /c:"'salary.approve'" flutter-app\lib\screens\performance\performance_screen.dart >nul || exit /b 1
          findstr /c:"'rewards.pay'" flutter-app\lib\screens\performance\performance_screen.dart >nul || exit /b 1
          findstr /c:"'promotion.approve'" flutter-app\lib\screens\performance\performance_screen.dart >nul || exit /b 1
          if not exist flutter-app\test\compensation_workspace_visibility_test.dart exit /b 1
          git diff --check

      - name: Commit wired workspace
        run: |
          git diff --quiet
          if not errorlevel 1 exit /b 0
          git config user.name "erp7-ci"
          git config user.email "erp7-ci@users.noreply.github.com"
          git add flutter-app\lib\screens\performance\performance_screen.dart flutter-app\test\compensation_workspace_visibility_test.dart
          git commit -m "feat: expose compensation workspace in performance module"
          git push origin HEAD:v740-business-completion
