name: EH7 Flutter v7.3.1 Full Audit

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - '.github/workflows/eh7-v731-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct current v7.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat dist/source.xz.parts/part-*.b64 | base64 -d > /tmp/base.tar.xz
          echo "b89b034254702f81b514c08995d3edc345947852b48f43fea4bd6e89e9c13c0a  /tmp/base.tar.xz" | sha256sum -c -
          rm -rf work && mkdir work
          tar -xJf /tmp/base.tar.xz -C work
          cd work
          patch -p1 --forward --batch < ../ci/clean10-flutter-compile-fix-1.patch
          python3 ../ci/clean10-analyzer-cleanup-2.py
          cd ..
          cat build-input/flutter-v720.parts3/part-*.b64 | base64 -d > /tmp/v720.tar.xz
          echo "8c446ef6a7c66575fb29089535eecd74d2ec9996c3effc56cebd47cd5fdb1e62  /tmp/v720.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v720.tar.xz -C work
          cat build-input/flutter-v720-missing.parts/part-*.b64 | base64 -d > /tmp/missing.tar.xz
          echo "f2b77954d97d373b6f39d5a10ebca33ffabde05efba866723157aceb1a7d9a4c  /tmp/missing.tar.xz" | sha256sum -c -
          tar -xJf /tmp/missing.tar.xz -C work
          base64 -d build-input/flutter-v720-record-detail.b64 > /tmp/detail.tar.xz
          echo "7dbfe5194ee26dc799d2682bfe49c7d55809a5bf352208e8f11ae24200aa225e  /tmp/detail.tar.xz" | sha256sum -c -
          tar -xJf /tmp/detail.tar.xz -C work
          cat build-input/flutter-v730-brand-small.parts/part-*.b64 | base64 -d > /tmp/brand.tar.xz
          echo "942d426faed11fd98120b07f294da8fd0da0abd8b8b1a7338030b10a5b16c534  /tmp/brand.tar.xz" | sha256sum -c -
          tar -xJf /tmp/brand.tar.xz -C work
          cat build-input/flutter-v730-analyzer-fix.parts/part-*.b64 | base64 -d > /tmp/analyzer.tar.xz
          echo "88e1af8322d038fdd9f68f501c480727129515945f5d50a0e0aa1c99faeb7d47  /tmp/analyzer.tar.xz" | sha256sum -c -
          tar -xJf /tmp/analyzer.tar.xz -C work
          cat build-input/flutter-v731-daily-batch-fix.parts/part-*.b64 | base64 -d > /tmp/v731.tar.xz
          echo "d52a44a6efc507a19fe1bcc1f14136cb54b219e2f387f31303bb395f891652c1  /tmp/v731.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v731.tar.xz -C work
          cat build-input/flutter-v731-issue-review-fix.parts/part-*.b64 | base64 -d > /tmp/review.tar.xz
          echo "2512983ae7b07fbd6c50bf76c2d26862e6d846ad12eece2e543824c9f8ae53a0  /tmp/review.tar.xz" | sha256sum -c -
          tar -xJf /tmp/review.tar.xz -C work

      - name: Static UI UX and logic audit
        shell: bash
        run: |
          cat > /tmp/audit.py <<'PY'
          from pathlib import Path
          import re, json, collections

          root=Path('work/flutter/excel_herbal_erp/lib')
          dart=sorted(root.rglob('*.dart'))
          screens=[p for p in dart if '/screens/' in p.as_posix()]
          data=[]; api=[]; risks=[]; logic=[]

          def line_no(txt, pos): return txt.count('\n',0,pos)+1
          def addrisk(sev,p,msg,line=None): risks.append({'severity':sev,'file':str(p.relative_to(root)),'line':line,'message':msg})

          for p in dart:
            txt=p.read_text(errors='replace')
            rel=str(p.relative_to(root))
            info={
              'file':rel,'lines':txt.count('\n')+1,
              'scaffold':txt.count('Scaffold('),'safe_area':txt.count('SafeArea('),
              'dialogs':txt.count('showDialog('),'bottom_sheets':txt.count('showModalBottomSheet'),
              'text_fields':txt.count('TextField(')+txt.count('TextFormField('),
              'dropdowns':txt.count('DropdownButton')+txt.count('DropdownMenu'),
              'list_views':txt.count('ListView'),'scroll_views':txt.count('SingleChildScrollView'),
              'rows':txt.count('Row('),'columns':txt.count('Column('),
              'cards':txt.count('Card('),'containers':txt.count('Container('),
              'buttons':sum(txt.count(x) for x in ['ElevatedButton(','FilledButton(','OutlinedButton(','TextButton(','IconButton(']),
              'catch_blocks':len(re.findall(r'catch\s*\(',txt)),
              'permission_refs':len(re.findall(r'permission|capabilit|hasAccess|can\(',txt,re.I)),
            }
            data.append(info)

            for i,line in enumerate(txt.splitlines(),1):
              s=line.strip()
              if re.search(r'\b(?:api|client|app\.api|_api)\s*\.\s*(?:get|post|put|patch|delete)\b|ApiPaths\.',s):
                api.append({'file':rel,'line':i,'text':s[:280]})
              if any(k in s.lower() for k in ['dailyorder','daily_order','evening','wholesale','return_quantity','issue stock','stockissue','idempot','refresh token','clearsession','logout','permission','capability','branchid','selectedbranch']):
                if len(logic)<1200: logic.append({'file':rel,'line':i,'text':s[:300]})

            if '/screens/' in p.as_posix():
              if 'showModalBottomSheet' in txt and 'isScrollControlled: true' not in txt:
                addrisk('HIGH',p,'Bottom sheet exists without isScrollControlled:true; long forms can clip.')
              if txt.count('TextField(')+txt.count('TextFormField(')>=6 and 'showDialog(' in txt:
                addrisk('HIGH',p,'Large form is implemented inside a dialog; high overflow/keyboard risk.')
              if re.search(r'toStringAsFixed\(3\)',txt):
                addrisk('MEDIUM',p,'3-decimal formatting is used in a user-facing screen; PCS should use whole-unit formatting where applicable.')
              if re.search(r'\b(?:Exception|FormatException)\b',txt) and ('Text(' in txt or 'error' in txt.lower()):
                addrisk('MEDIUM',p,'Exception terminology is present in a screen; verify no technical text leaks to users.')
              if re.search(r'\.toString\(\)',txt) and re.search(r'error|catch|exception',txt,re.I):
                addrisk('MEDIUM',p,'Raw toString() appears near error handling; verify error mapping is centralized.')
              if txt.count('Row(')>25 and info['text_fields']>3:
                addrisk('MEDIUM',p,'Dense Row-based form/layout; narrow-screen clipping risk.')
              if 'showModalBottomSheet' in txt and 'SafeArea(' not in txt:
                addrisk('MEDIUM',p,'Bottom-sheet code has no explicit SafeArea in this screen.')
              hard=[int(x) for x in re.findall(r'(?:width|height)\s*:\s*(\d{3,})',txt)]
              if hard and max(hard)>=500:
                addrisk('LOW',p,f'Large fixed dimension detected ({max(hard)}); responsiveness should be checked.')

          # Core/session checks
          for p in dart:
            txt=p.read_text(errors='replace'); rel=str(p.relative_to(root))
            if rel.endswith('api_client.dart'):
              if '401' not in txt: addrisk('HIGH',p,'API client has no obvious explicit 401 handling.')
              if '403' not in txt: addrisk('MEDIUM',p,'API client has no obvious explicit 403 handling.')
              if 'request_id' not in txt and 'X-Request-Id' not in txt: addrisk('MEDIUM',p,'Request-id diagnostics are not visibly consumed by the app client.')
            if rel.endswith('app_state.dart') or rel.endswith('app_shell.dart'):
              if re.search(r'catch[\s\S]{0,300}(?:logout|clearSession|clear\()',txt,re.I):
                addrisk('HIGH',p,'Session clearing/logout occurs near catch handling; network errors may risk unintended logout—manual review required.')

          sev=collections.Counter(r['severity'] for r in risks)
          summary={
            'dart_files':len(dart),'screen_files':len(screens),'total_lines':sum(x['lines'] for x in data),
            'api_reference_lines':len(api),'logic_reference_lines':len(logic),
            'risk_counts':dict(sev),
            'ui_totals':{k:sum(x[k] for x in data) for k in ['scaffold','safe_area','dialogs','bottom_sheets','text_fields','dropdowns','list_views','scroll_views','rows','cards','buttons']}
          }
          out=Path('audit-reports/v7.3.1'); out.mkdir(parents=True,exist_ok=True)
          (out/'audit.json').write_text(json.dumps({'summary':summary,'files':data,'risks':risks,'api':api,'logic':logic},indent=2))
          lines=['# Excel Herbal ERP Flutter v7.3.1 Full Static Audit','',f"Dart files: **{summary['dart_files']}**  ",f"Screen files: **{summary['screen_files']}**  ",f"Total Dart lines: **{summary['total_lines']}**  ",f"API reference lines: **{summary['api_reference_lines']}**  ",f"Risk flags: **HIGH {sev.get('HIGH',0)} / MEDIUM {sev.get('MEDIUM',0)} / LOW {sev.get('LOW',0)}**",'', '## UI inventory','']
          for k,v in summary['ui_totals'].items(): lines.append(f'- {k}: {v}')
          lines += ['', '## Risk flags','']
          for r in sorted(risks,key=lambda x:({'HIGH':0,'MEDIUM':1,'LOW':2}.get(x['severity'],9),x['file'])):
            lines.append(f"- **{r['severity']}** `{r['file']}` — {r['message']}")
          lines += ['', '## Per-screen inventory','']
          for x in data:
            if x['file'].startswith('screens/'):
              lines.append(f"- `{x['file']}` — {x['lines']} lines; fields {x['text_fields']}; dialogs {x['dialogs']}; sheets {x['bottom_sheets']}; SafeArea {x['safe_area']}; rows {x['rows']}; buttons {x['buttons']}")
          lines += ['', '## API call/reference excerpts','']
          for a in api[:500]: lines.append(f"- `{a['file']}:{a['line']}` `{a['text'].replace('`','')}`")
          (out/'AUDIT.md').write_text('\n'.join(lines))
          (out/'LOGIC-EXCERPTS.txt').write_text('\n'.join(f"{x['file']}:{x['line']} {x['text']}" for x in logic))
          print(json.dumps(summary,indent=2))
          PY
          python3 /tmp/audit.py

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v7.3.1
          git commit -m "Add Flutter v7.3.1 full UI UX logic audit [skip ci]" || exit 0
          git push origin HEAD:flutter-v720-build
