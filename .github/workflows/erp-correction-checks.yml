name: ERP correction verification
on:
  push:
    branches: [codex/erp735-document-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-correction-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # Limit execution-policy override to each CI process; do not change machine policy.
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
jobs:
  php-regression:
    if: github.ref == 'refs/heads/codex/erp735-document-integration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Provision portable PowerShell for PHP setup
        run: |
          $ErrorActionPreference = 'Stop'
          $psDir = Join-Path $env:RUNNER_TEMP 'eh7-pwsh-7.6.6'
          $archive = Join-Path $env:RUNNER_TEMP 'eh7-pwsh-7.6.6.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') {
            throw 'PowerShell archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $psDir -Force
          & (Join-Path $psDir 'pwsh.exe') -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $psDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up PHP 8.3 for backend checks
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
        env:
          runner: self-hosted
      - name: Locate PHP 8.1 or newer
        run: |
          $ErrorActionPreference = 'Stop'
          $phpCommand = Get-Command php.exe -ErrorAction SilentlyContinue
          $candidates = @($env:EH7_PHP_EXE)
          if ($phpCommand) { $candidates += $phpCommand.Source }
          $candidates += @('C:\php\php.exe', 'C:\xampp\php\php.exe', 'C:\actions-runner\eh7-toolcache\php\php.exe')
          $phpExe = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $phpExe) { throw 'PHP 8.1+ was not found. Install PHP CLI on ERP-PC and set EH7_PHP_EXE or add php.exe to the runner PATH, then restart the runner.' }
          & $phpExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $phpExe -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
          if ($LASTEXITCODE -ne 0) { throw 'PHP 8.1+ is required.' }
          "EH7_PHP_EXE=$phpExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: PHP lint and 24 regression cases
        working-directory: backend/excel-herbal-erp-v7
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem src,tests -Recurse -Filter *.php -File)
          $files += Get-Item excel-herbal-erp-v7.php
          foreach ($file in $files) {
            & $env:EH7_PHP_EXE -l $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:EH7_PHP_EXE tests/regression.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Route and contract checks
        run: |
          $ErrorActionPreference = 'Stop'
          $py = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3 backend/excel-herbal-erp-v7/tests/static_checks.py
          } else {
            $python = Get-Command python.exe -ErrorAction Stop
            & $python.Source backend/excel-herbal-erp-v7/tests/static_checks.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  flutter-integration:
    if: github.ref == 'refs/heads/codex/erp735-document-integration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate existing Flutter toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterExe = 'C:\actions-runner\eh7-toolcache\flutter-3.44.9\flutter\bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            $flutter = Get-Command flutter.bat -ErrorAction SilentlyContinue
            if (-not $flutter) { throw 'Flutter is not available. Start ERP-PC with its existing Flutter toolcache or add flutter.bat to the runner PATH.' }
            $flutterExe = $flutter.Source
          }
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EH7_FLUTTER_EXE=$flutterExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Dependencies
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Development web compile
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE build web --release --base-href /wp-content/uploads/eh7-flutter-web/ --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 --dart-define=EH7_ENVIRONMENT=development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
