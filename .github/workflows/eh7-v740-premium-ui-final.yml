name: EH7 v7.4 Premium UI Final

on:
  push:
    branches: [v740-premium-ui-dedupe]
    paths:
      - 'ci/premium-ui-final-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply final premium UI polish
        run: python3 ci/premium_ui_final_polish.py
      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get
      - name: Format final files
        working-directory: flutter-app
        run: >-
          dart format
          lib/screens/home/profile_screen.dart
          lib/screens/home/home_screen.dart
          lib/screens/my_work/my_work_screen.dart
          lib/screens/home/actions_screen.dart
          lib/shell/app_shell.dart
      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: flutter-app
        run: flutter test
      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat
      - name: Restore generated tracked files
        run: git restore -- flutter-app/android flutter-app/pubspec.lock
      - name: Remove final one-shot machinery
        run: >-
          rm -f
          ci/premium_ui_final_polish.py
          ci/premium-ui-final-trigger.txt
          .github/workflows/eh7-v740-premium-ui-final.yml
      - name: Commit validated final polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check -- flutter-app/lib
          git commit -m 'Polish premium navigation and workspace surfaces'
          git push origin HEAD:v740-premium-ui-dedupe
