name: EH7 v7.4 P1 Transaction Guardrails

on:
  push:
    branches: [v740-p1-transaction-guardrails]
    paths:
      - 'ci/p1_transaction_guardrails.py'
      - '.github/workflows/eh7-v740-p1-transaction-guardrails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v740-p1-transaction-guardrails
          fetch-depth: 0

      - name: Apply transaction guardrails
        run: python3 ci/p1_transaction_guardrails.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format changed files
        working-directory: flutter-app
        run: >-
          dart format
          lib/core/transaction_guardrails.dart
          lib/screens/sales/sales_screen.dart
          lib/screens/purchase/purchase_screen.dart
          lib/screens/finance/finance_screen.dart
          test/transaction_guardrails_test.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore build-generated tracked files
        run: git restore -- flutter-app/android flutter-app/pubspec.lock || true

      - name: Remove one-shot machinery
        run: |
          rm -f ci/p1_transaction_guardrails.py
          rm -f .github/workflows/eh7-v740-p1-transaction-guardrails.yml
          rmdir ci 2>/dev/null || true

      - name: Commit validated P1 screen alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            flutter-app/lib/screens/sales/sales_screen.dart \
            flutter-app/lib/screens/purchase/purchase_screen.dart \
            flutter-app/lib/screens/finance/finance_screen.dart
          git add -u -- ci .github/workflows
          git diff --cached --check -- flutter-app/lib
          git commit -m "Align transaction forms with backend guardrails"
          git push origin HEAD:v740-p1-transaction-guardrails
