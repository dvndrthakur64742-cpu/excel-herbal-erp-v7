name: EH7 Flutter v7.4.0 Finalize Code

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - '.github/workflows/eh7-v740-finalize-code.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply v7.4 final stabilization patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('flutter-app')

          # Keep the canonical project version aligned with the APK build.
          pubspec = root / 'pubspec.yaml'
          text = pubspec.read_text()
          text = text.replace('version: 7.3.1+731', 'version: 7.4.0+740')
          pubspec.write_text(text)

          # Drawer had an old PNG path while the canonical asset is WEBP.
          shell = root / 'lib/shell/app_shell.dart'
          text = shell.read_text().replace(
              'assets/branding/excel-herbal-logo.png',
              'assets/branding/excel-herbal-logo.webp',
          )
          shell.write_text(text)

          # Purchase posting must use WordPress business date, not phone clock date.
          purchase = root / 'lib/screens/purchase/purchase_screen.dart'
          text = purchase.read_text()
          text = text.replace("'bill_date': _today(),", "'bill_date': app.businessDate,")
          old_today = """\n  static String _today() {\n    final d = DateTime.now();\n    return '${d.year.toString().padLeft(4, '0')}-${d.month.toString().padLeft(2, '0')}-${d.day.toString().padLeft(2, '0')}';\n  }\n"""
          if text.count('_today()') == 1 and old_today in text:
              text = text.replace(old_today, '\n')
          purchase.write_text(text)

          my_work = root / 'lib/screens/my_work/my_work_screen.dart'
          text = my_work.read_text()
          text = text.replace("'business_date': _today(),", "'business_date': app.businessDate,")
          text = text.replace('                        value: selectedEmployee,',
                              '                        initialValue: selectedEmployee,')
          text = text.replace("                    final lid = int.parse('${l['id']}');\n", '')

          start = text.index('  Future<void> _editEvening(int id) async {')
          end = text.index('  Future<void> _finalPost(int id) async {', start)
          new_evening = r'''  Future<void> _editEvening(int id) async {
    final api = ref.read(apiClientProvider);
    final d = await _dailyDetail(id);
    final evening =
        Map<String, dynamic>.from((d['evening'] as Map?) ?? const {});
    final lines = ((evening['lines'] as List?) ?? const [])
        .map((e) => Map<String, dynamic>.from(e as Map))
        .toList();
    if (lines.isEmpty) throw Exception('Evening lines not found.');

    final returns = <int, TextEditingController>{};
    final wholesale = <int, TextEditingController>{};
    final wholesaleRate = <int, TextEditingController>{};
    for (final l in lines) {
      final key = int.parse('${l['issue_line_id']}');
      returns[key] =
          TextEditingController(text: '${l['return_quantity'] ?? 0}');
      wholesale[key] =
          TextEditingController(text: '${l['wholesale_quantity'] ?? 0}');
      wholesaleRate[key] =
          TextEditingController(text: '${l['wholesale_rate'] ?? 0}');
    }
    final customer = TextEditingController(
        text: '${evening['wholesale_customer_name'] ?? ''}');
    final note = TextEditingController(text: '${evening['notes'] ?? ''}');
    String? mode;

    try {
      if (!mounted) return;
      await showModalBottomSheet<void>(
        context: context,
        useSafeArea: true,
        isScrollControlled: true,
        backgroundColor: Colors.transparent,
        builder: (sheetContext) => StatefulBuilder(
          builder: (context, setLocal) => DraggableScrollableSheet(
            expand: false,
            initialChildSize: .92,
            minChildSize: .64,
            maxChildSize: .98,
            builder: (context, scrollController) => Material(
              color: Theme.of(context).colorScheme.surface,
              borderRadius:
                  const BorderRadius.vertical(top: Radius.circular(28)),
              clipBehavior: Clip.antiAlias,
              child: Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(20, 12, 12, 12),
                    child: Row(
                      children: [
                        Container(
                          width: 44,
                          height: 44,
                          decoration: BoxDecoration(
                            color: ExcelBrand.primarySoft,
                            borderRadius: BorderRadius.circular(14),
                          ),
                          child: const Icon(
                            Icons.nightlight_round,
                            color: ExcelBrand.primaryDark,
                          ),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                'Evening Closing',
                                style: Theme.of(context).textTheme.titleLarge,
                              ),
                              const SizedBox(height: 2),
                              Text(
                                'Daily Order #$id · ${lines.length} products',
                                style: Theme.of(context).textTheme.bodySmall,
                              ),
                            ],
                          ),
                        ),
                        IconButton(
                          tooltip: 'Close',
                          onPressed: () => Navigator.pop(sheetContext),
                          icon: const Icon(Icons.close_rounded),
                        ),
                      ],
                    ),
                  ),
                  const Divider(height: 1),
                  Expanded(
                    child: ListView(
                      controller: scrollController,
                      padding: const EdgeInsets.fromLTRB(16, 14, 16, 24),
                      children: [
                        Container(
                          padding: const EdgeInsets.all(13),
                          decoration: BoxDecoration(
                            color: ExcelBrand.primarySoft,
                            borderRadius: BorderRadius.circular(16),
                          ),
                          child: const Row(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Icon(Icons.calculate_outlined,
                                  color: ExcelBrand.primaryDark),
                              SizedBox(width: 10),
                              Expanded(
                                child: Text(
                                  'Return aur Wholesale quantity enter karein. Retail Sold quantity ERP automatically calculate karega.',
                                ),
                              ),
                            ],
                          ),
                        ),
                        const SizedBox(height: 12),
                        ...lines.map((l) {
                          final key = int.parse('${l['issue_line_id']}');
                          final issued =
                              double.tryParse('${l['issued_quantity']}') ?? 0;
                          final retailRate =
                              double.tryParse('${l['retail_rate']}') ?? 0;
                          final ret =
                              WholePcs.parseOrZero(returns[key]!.text);
                          final wh =
                              WholePcs.parseOrZero(wholesale[key]!.text);
                          final calculated = issued - ret - wh;
                          final sold = calculated < 0 ? 0 : calculated;
                          final over = ret + wh > issued + .0001;

                          Widget returnField() => TextField(
                                controller: returns[key],
                                keyboardType: TextInputType.number,
                                inputFormatters: [WholePcs.positiveFormatter],
                                onChanged: (_) => setLocal(() {}),
                                decoration: const InputDecoration(
                                  labelText: 'Return Qty',
                                  prefixIcon: Icon(Icons.keyboard_return_rounded),
                                ),
                              );

                          Widget wholesaleField() => TextField(
                                controller: wholesale[key],
                                keyboardType: TextInputType.number,
                                inputFormatters: [WholePcs.positiveFormatter],
                                onChanged: (_) => setLocal(() {}),
                                decoration: const InputDecoration(
                                  labelText: 'Wholesale Qty',
                                  prefixIcon: Icon(Icons.storefront_outlined),
                                ),
                              );

                          Widget rateField() => TextField(
                                controller: wholesaleRate[key],
                                enabled: wh > 0,
                                keyboardType:
                                    const TextInputType.numberWithOptions(
                                  decimal: true,
                                ),
                                decoration: InputDecoration(
                                  labelText: 'Wholesale Rate',
                                  prefixText: '₹ ',
                                  helperText: wh > 0
                                      ? 'Max ₹${retailRate.toStringAsFixed(2)}'
                                      : 'Wholesale Qty enter karein',
                                ),
                              );

                          return Padding(
                            padding: const EdgeInsets.only(bottom: 11),
                            child: Card(
                              child: Padding(
                                padding: const EdgeInsets.all(14),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Row(
                                      crossAxisAlignment:
                                          CrossAxisAlignment.start,
                                      children: [
                                        Expanded(
                                          child: Column(
                                            crossAxisAlignment:
                                                CrossAxisAlignment.start,
                                            children: [
                                              Text(
                                                BusinessFormat.displayName(
                                                  '${l['product_name'] ?? 'Product'}',
                                                ),
                                                style: Theme.of(context)
                                                    .textTheme
                                                    .titleMedium,
                                              ),
                                              const SizedBox(height: 4),
                                              Text(
                                                'Issued ${BusinessFormat.quantity(issued)} · Retail ₹${retailRate.toStringAsFixed(2)}',
                                                style: Theme.of(context)
                                                    .textTheme
                                                    .bodySmall,
                                              ),
                                            ],
                                          ),
                                        ),
                                        Container(
                                          padding: const EdgeInsets.symmetric(
                                            horizontal: 10,
                                            vertical: 6,
                                          ),
                                          decoration: BoxDecoration(
                                            color: over
                                                ? const Color(0xFFFFECEC)
                                                : ExcelBrand.primarySoft,
                                            borderRadius:
                                                BorderRadius.circular(999),
                                          ),
                                          child: Text(
                                            over
                                                ? 'Check Qty'
                                                : 'Sold ${BusinessFormat.quantity(sold)}',
                                            style: TextStyle(
                                              color: over
                                                  ? ExcelBrand.danger
                                                  : ExcelBrand.primaryDark,
                                              fontWeight: FontWeight.w800,
                                            ),
                                          ),
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 12),
                                    LayoutBuilder(
                                      builder: (context, constraints) {
                                        if (constraints.maxWidth < 520) {
                                          return Column(
                                            children: [
                                              returnField(),
                                              const SizedBox(height: 10),
                                              Row(
                                                children: [
                                                  Expanded(
                                                      child: wholesaleField()),
                                                  const SizedBox(width: 10),
                                                  Expanded(child: rateField()),
                                                ],
                                              ),
                                            ],
                                          );
                                        }
                                        return Row(
                                          children: [
                                            Expanded(child: returnField()),
                                            const SizedBox(width: 10),
                                            Expanded(child: wholesaleField()),
                                            const SizedBox(width: 10),
                                            Expanded(child: rateField()),
                                          ],
                                        );
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          );
                        }),
                        const SizedBox(height: 2),
                        TextField(
                          controller: customer,
                          decoration: const InputDecoration(
                            labelText: 'Wholesale Customer',
                            hintText: 'Wholesale sale ho tab required',
                            prefixIcon: Icon(Icons.person_outline_rounded),
                          ),
                        ),
                        const SizedBox(height: 10),
                        TextField(
                          controller: note,
                          minLines: 2,
                          maxLines: 4,
                          decoration: const InputDecoration(
                            labelText: 'Note (optional)',
                            prefixIcon: Icon(Icons.notes_rounded),
                          ),
                        ),
                      ],
                    ),
                  ),
                  const Divider(height: 1),
                  SafeArea(
                    top: false,
                    child: Padding(
                      padding: const EdgeInsets.fromLTRB(16, 10, 16, 12),
                      child: Wrap(
                        alignment: WrapAlignment.end,
                        spacing: 8,
                        runSpacing: 8,
                        children: [
                          TextButton(
                            onPressed: () => Navigator.pop(sheetContext),
                            child: const Text('Cancel'),
                          ),
                          FilledButton.tonalIcon(
                            onPressed: () {
                              mode = 'save';
                              Navigator.pop(sheetContext);
                            },
                            icon: const Icon(Icons.save_outlined),
                            label: const Text('Save Draft'),
                          ),
                          FilledButton.icon(
                            onPressed: () {
                              mode = 'submit';
                              Navigator.pop(sheetContext);
                            },
                            icon: const Icon(Icons.check_circle_outline),
                            label: const Text('Save & Submit'),
                          ),
                        ],
                      ),
                    ),
                  ),
                ],
              ),
            ),
          ),
        ),
      );

      if (mode == null) return;

      final payload = <Map<String, dynamic>>[];
      var anyWholesale = false;
      for (final l in lines) {
        final key = int.parse('${l['issue_line_id']}');
        final ret = WholePcs.parseOrZero(returns[key]!.text);
        final wh = WholePcs.parseOrZero(wholesale[key]!.text);
        final issued = double.tryParse('${l['issued_quantity']}') ?? 0;
        final retailRate = double.tryParse('${l['retail_rate']}') ?? 0;
        final whRate = double.tryParse(wholesaleRate[key]!.text) ?? 0;

        if (ret + wh > issued + 0.0001) {
          throw Exception(
            '${l['product_name']}: Return + Wholesale issued quantity se zyada nahi ho sakta.',
          );
        }
        if (wh > 0 && (whRate <= 0 || whRate > retailRate + .005)) {
          throw Exception(
            '${l['product_name']}: Wholesale rate 0 se zyada aur retail rate se kam/equal hona chahiye.',
          );
        }
        if (wh > 0) anyWholesale = true;
        payload.add({
          'issue_line_id': key,
          'return_quantity': ret,
          'wholesale_quantity': wh,
          'retail_rate': retailRate,
          'wholesale_rate': whRate,
        });
      }

      if (anyWholesale && customer.text.trim().isEmpty) {
        throw Exception('Wholesale customer name required.');
      }

      await api.post(
        ApiPaths.eveningSave(id),
        data: {
          'lines': payload,
          'wholesale_details': {
            'wholesale_customer_name': customer.text.trim(),
          },
          'price_reason': note.text.trim(),
        },
      );
      if (mode == 'submit') {
        await api.post(ApiPaths.eveningSubmit(id), data: const {});
      }
      if (mounted) {
        setState(() {
          refresh++;
          message = mode == 'submit'
              ? 'Evening submitted. Final Post pending.'
              : 'Evening draft saved.';
        });
      }
    } finally {
      for (final c in returns.values) c.dispose();
      for (final c in wholesale.values) c.dispose();
      for (final c in wholesaleRate.values) c.dispose();
      customer.dispose();
      note.dispose();
    }
  }

'''
          text = text[:start] + new_evening + text[end:]

          old_sold = r'''                          final returned = num.tryParse(
                                  '${l['return_quantity'] ?? l['return_qty'] ?? 0}') ??
                              0;
                          final sold = num.tryParse(
                                  '${l['sold_quantity'] ?? l['sold_qty'] ?? 0}') ??
                              0;
'''
          new_sold = r'''                          final returned = num.tryParse(
                                  '${l['return_quantity'] ?? l['return_qty'] ?? 0}') ??
                              0;
                          final wholesaleSold = num.tryParse(
                                  '${l['wholesale_quantity'] ?? 0}') ??
                              0;
                          final issued = num.tryParse(
                                  '${l['issued_quantity'] ?? 0}') ??
                              0;
                          final soldRaw = l['sold_quantity'] ?? l['sold_qty'];
                          final calculatedSold = issued - returned;
                          final sold = soldRaw == null
                              ? (calculatedSold > 0 ? calculatedSold : 0)
                              : (num.tryParse('$soldRaw') ??
                                  ((issued - returned - wholesaleSold) > 0
                                      ? issued - returned
                                      : 0));
'''
          if old_sold not in text:
              raise SystemExit('Daily detail sold block not found')
          text = text.replace(old_sold, new_sold, 1)
          my_work.write_text(text)
          PY

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Format
        working-directory: flutter-app
        run: dart format lib test

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Commit canonical v7.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter-app
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Flutter v7.4.0 Daily Order UX and business logic'
          git push origin HEAD:flutter-v720-build
