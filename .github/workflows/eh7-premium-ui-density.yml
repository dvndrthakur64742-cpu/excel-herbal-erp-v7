name: EH7 Premium UI Density Validation

on:
  push:
    branches: [v740-premium-ui-density]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Normalize one-shot theme patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/apply_premium_ui_density.py')
          t = p.read_text()
          old = "    if old not in text:\n        raise SystemExit(f'Theme expectation missing: {old}')\n    text = text.replace(old, new)"
          new = "    if old not in text:\n        if 'shape: RoundedRectangleBorder' in old and 'circular(14)' in old:\n            continue\n        raise SystemExit(f'Theme expectation missing: {old}')\n    text = text.replace(old, new)"
          if old not in t:
              raise SystemExit('Theme loop normalization marker missing')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Apply premium UI density patch
        run: python3 ci/apply_premium_ui_density.py

      - name: Assert intended UI architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q "return ordered.take(3).toList" flutter-app/lib/widgets/records_list.dart
          grep -q "class _CompactContext" flutter-app/lib/screens/home/home_screen.dart
          grep -q "labelText: 'Branch'" flutter-app/lib/widgets/branch_selector.dart
          grep -q "Supplier billing, payments and outstanding summary" flutter-app/lib/screens/reports/reports_screen.dart
          grep -q "toolbarHeight: 58" flutter-app/lib/theme/excel_brand.dart

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format intended Dart files
        working-directory: flutter-app
        run: >-
          dart format
          lib/theme/excel_brand.dart
          lib/widgets/branch_selector.dart
          lib/widgets/records_list.dart
          lib/screens/home/home_screen.dart
          lib/shell/app_shell.dart
          lib/screens/reports/reports_screen.dart
          lib/screens/my_work/my_work_screen.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore generated tracked files
        shell: bash
        run: |
          set -euo pipefail
          git restore -- flutter-app/android flutter-app/pubspec.lock || true

      - name: Remove one-shot validation machinery
        shell: bash
        run: |
          rm -f ci/apply_premium_ui_density.py
          rm -f ci/premium-ui-density-trigger.txt
          rm -f .github/workflows/eh7-premium-ui-density.yml

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            flutter-app/lib/theme/excel_brand.dart \
            flutter-app/lib/widgets/branch_selector.dart \
            flutter-app/lib/widgets/records_list.dart \
            flutter-app/lib/screens/home/home_screen.dart \
            flutter-app/lib/shell/app_shell.dart \
            flutter-app/lib/screens/reports/reports_screen.dart \
            flutter-app/lib/screens/my_work/my_work_screen.dart
          git add -u -- \
            ci/apply_premium_ui_density.py \
            ci/premium-ui-density-trigger.txt \
            .github/workflows/eh7-premium-ui-density.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              'flutter-app/lib/theme/excel_brand.dart',
              'flutter-app/lib/widgets/branch_selector.dart',
              'flutter-app/lib/widgets/records_list.dart',
              'flutter-app/lib/screens/home/home_screen.dart',
              'flutter-app/lib/shell/app_shell.dart',
              'flutter-app/lib/screens/reports/reports_screen.dart',
              'flutter-app/lib/screens/my_work/my_work_screen.dart',
              'ci/apply_premium_ui_density.py',
              'ci/premium-ui-density-trigger.txt',
              '.github/workflows/eh7-premium-ui-density.yml',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected staged paths: {unexpected}')
          print('Validated staged paths:', sorted(changed))
          PY
          git diff --cached --check -- flutter-app/lib
          git commit -m 'Apply premium enterprise UI density pass'
          git push origin HEAD:v740-premium-ui-density
