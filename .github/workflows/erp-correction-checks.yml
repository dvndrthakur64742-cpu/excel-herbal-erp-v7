  final-uat-bundle:
    if: github.ref == 'refs/heads/codex/erp735-document-integration' && (contains(github.event.head_commit.message, '[deploy-uat-current]') || (github.event_name == 'workflow_dispatch' && inputs.deploy_controlled_uat == true)) && !contains(github.event.head_commit.message, '[deploy-only-session-race]')
