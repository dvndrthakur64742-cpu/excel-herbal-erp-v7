  deploy-uat-current-erp:
    if: github.ref == 'refs/heads/codex/erp735-document-integration' && (contains(github.event.head_commit.message, '[deploy-uat-current]') || (github.event_name == 'workflow_dispatch' && inputs.deploy_controlled_uat == true))
    needs: [php-regression, flutter-integration, prepare-uat-candidate]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      UAT_SITE_URL: ${{ inputs.controlled_uat_site_url || vars.EH7_CONTROLLED_UAT_SITE_URL || 'https://office.excelherbal.in' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Deploy backend and certified web through current ERP workflow
        run: |
          & '.github/scripts/deploy-uat-current-erp-workflow.ps1' -SourceHead $env:GITHUB_SHA -UatSiteUrl $env:UAT_SITE_URL
      - name: Strict controlled UAT preflight
        run: |
          $hostName = ([Uri]$env:UAT_SITE_URL).Host
          if ($hostName -ieq 'office.excelherbal.in') {
            New-Item -ItemType Directory -Path 'dist/staging-target-preflight' -Force | Out-Null
            @{
              skipped = $true
              reason = 'office BUILD/UAT workspace is not the isolated fresh-synthetic release-UAT target'
              source_head = $env:GITHUB_SHA
              target_host = $hostName
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'dist/staging-target-preflight/EVIDENCE.json' -Encoding utf8
            Write-Host 'INFO strict_isolated_uat_preflight=skipped office_build_uat_workspace=true'
            exit 0
          }
          $apiBase = $env:UAT_SITE_URL.TrimEnd('/') + '/wp-json/excel-herbal-erp/v7'
          & '.github/scripts/staging-target-preflight.ps1' `
            -ApiBase $apiBase `
            -ExpectedSourceHead $env:GITHUB_SHA
      - name: Upload controlled UAT preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EH7-Controlled-UAT-Preflight-Evidence
          path: dist/staging-target-preflight/EVIDENCE.json
          if-no-files-found: warn
      - name: Verify live backend head and certified web artifact SHA
        run: |
          $ErrorActionPreference = 'Stop'
          $health = $null
          $lastHealthError = ''
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $health = Invoke-RestMethod -UseBasicParsing -Uri ($env:UAT_SITE_URL.TrimEnd('/') + '/wp-json/excel-herbal-erp/v7/health?cb=' + [Guid]::NewGuid().ToString('N')) -TimeoutSec 20
              break
            } catch {
              $lastHealthError = $_.Exception.Message
              if ($attempt -lt 6) {
                Start-Sleep -Seconds ([Math]::Min(10, $attempt * 2))
              }
            }
          }
          if (-not $health) { throw ('Live health verification failed after retries: ' + $lastHealthError) }
          $healthData = if ($health.data) { $health.data } else { $health }
          if ([string]$healthData.environment -ne 'staging') { throw ('Controlled UAT environment mismatch: ' + [string]$healthData.environment) }
          $liveHead = if ($health.data -and $health.data.source_head) { [string]$health.data.source_head } elseif ($health.source_head) { [string]$health.source_head } else { '' }
          if ($liveHead -ne $env:GITHUB_SHA) { throw ('Live backend source_head mismatch: ' + $liveHead) }

          $releaseRoot = Join-Path $env:USERPROFILE ('ERP7-Releases\\uat-candidates\\' + $env:GITHUB_SHA)
          $candidate = Join-Path $releaseRoot 'web\\main.dart.js'
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { throw 'Exact-head candidate main.dart.js is missing.' }
          $live = Join-Path $env:RUNNER_TEMP ('eh7-live-main-' + [Guid]::NewGuid().ToString('N') + '.js')
          $liveDownloaded = $false
          $lastLiveCurlExit = 0
          for ($downloadAttempt = 1; $downloadAttempt -le 4; $downloadAttempt++) {
            Remove-Item -LiteralPath $live -Force -ErrorAction SilentlyContinue
            & curl.exe --fail --location --silent --show-error --connect-timeout 15 --max-time 90 --output $live ($env:UAT_SITE_URL.TrimEnd('/') + '/wp-content/uploads/eh7-flutter-web/main.dart.js?cb=' + [Guid]::NewGuid().ToString('N'))
            $lastLiveCurlExit = $LASTEXITCODE
            if ($lastLiveCurlExit -eq 0 -and (Test-Path -LiteralPath $live -PathType Leaf) -and (Get-Item -LiteralPath $live).Length -gt 0) {
              $liveDownloaded = $true
              break
            }
            if ($downloadAttempt -lt 4) { Start-Sleep -Seconds ([Math]::Min(8, $downloadAttempt * 2)) }
          }
          if (-not $liveDownloaded) { throw ('Live web verification download failed after retries. curl_exit=' + $lastLiveCurlExit) }
          $expected = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $live -Algorithm SHA256).Hash.ToLowerInvariant()
          Remove-Item -LiteralPath $live -Force -ErrorAction SilentlyContinue
          if ($expected -ne $actual) { throw ('Live web artifact SHA mismatch. expected=' + $expected + ' actual=' + $actual) }

          $runtime = if ($health.data -and $health.data.web_runtime) { $health.data.web_runtime } elseif ($health.web_runtime) { $health.web_runtime } else { $null }
          if (-not $runtime) { throw 'Health endpoint did not expose web_runtime integrity.' }
          $webHead = [string]$runtime.source_head
          $serverHash = [string]$runtime.main_sha256
          if ($webHead -ne $env:GITHUB_SHA) { throw ('Live web source_head mismatch: ' + $webHead) }
          if ($serverHash -ne $expected) { throw ('Live server-side web SHA mismatch. expected=' + $expected + ' actual=' + $serverHash) }

          Write-Host "PASS live_backend_source_head=$liveHead"
          Write-Host "PASS live_web_source_head=$webHead"
          Write-Host "PASS live_web_sha256=$actual"
          Write-Host "PASS live_server_web_sha256=$serverHash"

