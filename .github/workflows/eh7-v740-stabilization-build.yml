name: EH7 Flutter v7.4.0 Stabilization Build

on:
  workflow_dispatch:
  push:
    branches: [v7-hierarchy-gps-reporting-dashboard]
    paths:
      - '.github/workflows/eh7-v740-stabilization-build.yml'

concurrency:
  group: eh7-v740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify hierarchy/reporting/GPS frontend invariants
        working-directory: flutter-app
        run: python tool/finalize_hierarchy_gps_frontend.py

      - name: Verify branch selector state sync
        working-directory: flutter-app
        run: python tool/verify_branch_selector_state_sync.py

      - name: Verify Flutter API paths against v7 backend
        working-directory: flutter-app
        run: python tool/verify_api_paths_against_backend.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK packages
        shell: powershell
        run: |
          cmd.exe /c "(for /l %i in (1,1,100) do @echo y) | sdkmanager --licenses"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter 3.44.9 stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Verify Flutter toolchain
        shell: powershell
        run: |
          flutter --version
          flutter config --no-analytics
          flutter doctor -v

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK and SHA256
        shell: powershell
        run: |
          $apk = 'flutter-app/build/app/outputs/flutter-apk/app-debug.apk'
          if (!(Test-Path $apk) -or ((Get-Item $apk).Length -le 0)) { throw 'APK missing or empty' }
          New-Item -ItemType Directory -Force -Path 'dist/flutter-v7.4.0' | Out-Null
          $out = 'dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk'
          Copy-Item $apk $out -Force
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          "$hash  Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk" | Set-Content -Encoding ascii 'dist/flutter-v7.4.0/APK-SHA256.txt'
          Get-Item $out | Format-List FullName,Length
          Get-Content 'dist/flutter-v7.4.0/APK-SHA256.txt'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error
