name: EH7 Flutter v7.4.0 Safety Hardening

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - '.github/workflows/eh7-v740-safety-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply destructive action confirmations
        run: python3 ci/v740_safety_hardening.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Format
        working-directory: flutter-app
        run: dart format lib test

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Commit canonical safety hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            flutter-app/lib/screens/tools/erp_tools_screen.dart \
            flutter-app/lib/screens/administration/administration_screen.dart
          if git diff --cached --quiet; then
            echo 'No safety changes to commit.'
            exit 0
          fi
          git commit -m 'Harden v7.4 destructive admin actions'
          git push origin HEAD:flutter-v720-build
