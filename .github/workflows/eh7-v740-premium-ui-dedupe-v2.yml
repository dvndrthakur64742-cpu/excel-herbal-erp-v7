name: EH7 v7.4 Premium UI Dedupe v2

on:
  push:
    branches: [v740-premium-ui-dedupe]
    paths:
      - 'ci/premium-ui-trigger-v2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply premium UI dedupe patch
        run: python3 ci/premium_ui_dedupe_v2.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format intended files
        working-directory: flutter-app
        run: >-
          dart format
          lib/theme/excel_brand.dart
          lib/screens/reports/reports_screen.dart
          lib/screens/home/actions_screen.dart
          lib/widgets/records_list.dart
          lib/shell/app_shell.dart
          lib/screens/inventory/inventory_screen.dart
          lib/screens/sales/sales_screen.dart
          lib/screens/my_work/my_work_screen.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore generated tracked files
        run: git restore -- flutter-app/android flutter-app/pubspec.lock

      - name: Remove one-shot machinery
        run: >-
          rm -f
          ci/premium_ui_dedupe.py
          ci/premium_ui_dedupe_v2.py
          ci/premium-ui-trigger.txt
          ci/premium-ui-trigger-v2.txt
          .github/workflows/eh7-v740-premium-ui-dedupe.yml
          .github/workflows/eh7-v740-premium-ui-dedupe-v2.yml

      - name: Commit validated premium UI dedupe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          ALLOWED='^(flutter-app/lib/(theme/excel_brand.dart|screens/reports/reports_screen.dart|screens/home/actions_screen.dart|widgets/records_list.dart|shell/app_shell.dart|screens/inventory/inventory_screen.dart|screens/sales/sales_screen.dart|screens/my_work/my_work_screen.dart)|ci/premium_ui_dedupe.py|ci/premium_ui_dedupe_v2.py|ci/premium-ui-trigger.txt|ci/premium-ui-trigger-v2.txt|\.github/workflows/eh7-v740-premium-ui-dedupe.yml|\.github/workflows/eh7-v740-premium-ui-dedupe-v2.yml)$'
          BAD=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected staged paths:"
            echo "$BAD"
            exit 1
          fi
          git diff --cached --check -- flutter-app/lib
          git commit -m 'Apply premium mobile UI density and remove duplicate navigation'
          git push origin HEAD:v740-premium-ui-dedupe
