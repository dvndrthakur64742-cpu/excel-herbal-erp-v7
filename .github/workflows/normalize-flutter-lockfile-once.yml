name: Normalize Flutter lockfile once

on:
  push:
    branches: [codex/erp735-document-integration]
    paths:
      - '.github/workflows/normalize-flutter-lockfile-once.yml'

permissions:
  contents: write

concurrency:
  group: normalize-flutter-lockfile-once
  cancel-in-progress: false

jobs:
  normalize-lockfile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/erp735-document-integration
          fetch-depth: 0
      - name: Normalize pubspec.lock with pinned Flutter 3.44.9
        working-directory: flutter-app
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterExe = 'C:\actions-runner\eh7-toolcache\flutter-3.44.9\flutter\bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) { throw 'Pinned Flutter 3.44.9 toolchain missing.' }
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $flutterExe pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- pubspec.lock
      - name: Commit only normalized lockfile
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --quiet -- flutter-app/pubspec.lock
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'pubspec.lock already normalized.'
            exit 0
          }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'flutter-app/pubspec.lock') {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- flutter-app/pubspec.lock
          git commit -m 'build: normalize Flutter 3.44.9 dependency lockfile'
          git push origin HEAD:codex/erp735-document-integration
