name: EH7 Flutter v7.4.0 Stabilization Build

on:
  push:
    branches: [flutter-v720-build, v7-hierarchy-gps-reporting-dashboard]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/eh7-v740-stabilization-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply final hierarchy/GPS frontend corrections
        working-directory: flutter-app
        run: python3 tool/finalize_hierarchy_gps_frontend.py

      - name: Commit canonical source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-app/lib/shell/app_shell.dart flutter-app/lib/screens/tools/erp_tools_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize hierarchy GPS frontend [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=flutter-app/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          mkdir -p dist/flutter-v7.4.0
          cp "$APK" dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
          sha256sum dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk | tee dist/flutter-v7.4.0/APK-SHA256.txt

      - name: Upload workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error

      - name: Publish UAT release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v7.4.0-stabilization-uat
          APK=dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
          HASH=dist/flutter-v7.4.0/APK-SHA256.txt
          TARGET_SHA=$(git rev-parse HEAD)
          NOTES="UAT APK from canonical editable Flutter source. Source commit: ${TARGET_SHA}. Includes hierarchy/reporting designation separation, non-authority additional designations, hierarchy-scoped GPS team visibility, automatic duty-route lifecycle, Price Distribution reporting, and authority-projected Home dashboard. v14 code is not merged. UAT only."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$APK" "$HASH" \
            --target "$TARGET_SHA" \
            --title "Excel Herbal ERP Flutter v7.4.0 Stabilization UAT" \
            --notes "$NOTES" \
            --prerelease
