name: EH7 One-shot Web Runtime Patch

on:
  push:
    branches: [v740-web-readiness]
    paths:
      - '.github/workflows/eh7-web-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Patch browser document upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter-app/lib/screens/tools/erp_tools_screen.dart')
          s = p.read_text()
          old_import = "import 'package:file_picker/file_picker.dart';\nimport 'package:flutter/material.dart';"
          new_import = "import 'package:file_picker/file_picker.dart';\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';"
          assert old_import in s, 'import anchor missing'
          s = s.replace(old_import, new_import, 1)

          start = s.index('  Future<void> _uploadDocument(int employeeId) async {')
          end = s.index('  Future<List<Map<String, dynamic>>> _employeeChoices() async {', start)
          replacement = '''  Future<void> _uploadDocument(int employeeId) async {
            final picked = await FilePicker.platform.pickFiles(
              allowMultiple: false,
              type: FileType.custom,
              allowedExtensions: const ['pdf', 'jpg', 'jpeg', 'png', 'webp'],
              withData: kIsWeb,
            );
            final file = picked?.files.single;
            if (file == null) return;
            if (!kIsWeb && file.path == null) return;
            if (kIsWeb && file.bytes == null) {
              _msg('Browser could not read the selected file. Please select it again.');
              return;
            }
            final type = TextEditingController(text: 'employee_document');
            final title = TextEditingController(text: file.name);
            final ok = await showDialog<bool>(
              context: context,
              builder: (context) => AlertDialog(
                title: const Text('Upload Employee Document'),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    TextField(
                      controller: type,
                      decoration: const InputDecoration(labelText: 'Document Type'),
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      controller: title,
                      decoration: const InputDecoration(labelText: 'Title'),
                    ),
                  ],
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context, false),
                    child: const Text('Cancel'),
                  ),
                  FilledButton(
                    onPressed: () => Navigator.pop(context, true),
                    child: const Text('Upload'),
                  ),
                ],
              ),
            );
            if (ok == true) {
              try {
                final api = ref.read(apiClientProvider);
                final fields = {
                  'document_type': type.text.trim(),
                  'title': title.text.trim(),
                };
                if (kIsWeb) {
                  await api.uploadBytes(
                    ApiPaths.employeeDocumentUpload(employeeId),
                    bytes: file.bytes!,
                    filename: file.name,
                    fields: fields,
                  );
                } else {
                  await api.uploadFile(
                    ApiPaths.employeeDocumentUpload(employeeId),
                    filePath: file.path!,
                    filename: file.name,
                    fields: fields,
                  );
                }
                _msg('Document uploaded.');
                if (mounted) setState(() => refresh++);
              } catch (e) {
                _msg(UiError.message(e));
              }
            }
            type.dispose();
            title.dispose();
          }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          grep -q "withData: kIsWeb" flutter-app/lib/screens/tools/erp_tools_screen.dart
          grep -q "api.uploadBytes" flutter-app/lib/screens/tools/erp_tools_screen.dart
          grep -q "Excel Herbal ERP Web" flutter-app/lib/core/api_client.dart

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format
        working-directory: flutter-app
        run: dart format lib/core/api_client.dart lib/core/gps_tracking_service.dart lib/screens/tools/erp_tools_screen.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build Web
        working-directory: flutter-app
        run: >-
          flutter build web --release
          --base-href /wp-content/uploads/eh7-flutter-web/
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Commit validated runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eh7-web-runtime-patch.yml
          git add flutter-app/lib/core/api_client.dart flutter-app/lib/core/gps_tracking_service.dart flutter-app/lib/screens/tools/erp_tools_screen.dart
          git commit -m "Add browser-safe ERP runtime support"
          git push origin HEAD:v740-web-readiness
