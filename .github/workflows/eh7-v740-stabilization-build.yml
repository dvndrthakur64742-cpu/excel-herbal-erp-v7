name: EH7 Flutter v7.4.0 Stabilization Build

on:
  workflow_dispatch:
  push:
    branches: [v7-hierarchy-gps-reporting-dashboard]
    paths:
      - '.github/workflows/eh7-v740-stabilization-build.yml'

concurrency:
  group: eh7-v740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  build:
    # ERP7-PC self-hosted certification path; avoids local PowerShell execution-policy changes.
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bootstrap Python 3.12
        run: |
          set PYZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip
          set PYDIR=%RUNNER_TEMP%\python-3.12.10-embed
          if exist "%PYDIR%" rmdir /s /q "%PYDIR%"
          curl.exe -fL --retry 10 --retry-all-errors --retry-delay 2 "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -o "%PYZIP%"
          if errorlevel 1 exit /b 1
          mkdir "%PYDIR%"
          tar.exe -xf "%PYZIP%" -C "%PYDIR%"
          if errorlevel 1 exit /b 1
          echo %PYDIR%>>"%GITHUB_PATH%"
          "%PYDIR%\python.exe" --version

      - name: Verify hierarchy/reporting/GPS frontend invariants
        working-directory: flutter-app
        run: python tool\finalize_hierarchy_gps_frontend.py

      - name: Verify branch selector state sync
        working-directory: flutter-app
        run: python tool\verify_branch_selector_state_sync.py

      - name: Verify Flutter API paths against v7 backend
        working-directory: flutter-app
        run: python tool\verify_api_paths_against_backend.py

      - name: Bootstrap JDK 17 with persistent resume cache
        run: |
          set CACHE=C:\actions-runner\eh7-toolcache
          set JDKZIP=C:\actions-runner\eh7-toolcache\jdk17.zip
          set JDKROOT=C:\actions-runner\eh7-toolcache\jdk17
          if not exist "%CACHE%" mkdir "%CACHE%"
          if exist "%RUNNER_TEMP%\jdk17.zip" if not exist "%JDKZIP%" copy /y "%RUNNER_TEMP%\jdk17.zip" "%JDKZIP%"
          if exist "%JDKZIP%.complete" goto jdk_downloaded
          curl.exe -fL -C - --retry 50 --retry-all-errors --retry-delay 3 "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk" -o "%JDKZIP%"
          if errorlevel 1 exit /b 1
          echo complete>"%JDKZIP%.complete"
          :jdk_downloaded
          for /d %%D in ("%JDKROOT%\*") do if exist "%%~fD\bin\javac.exe" goto jdk_ready
          if exist "%JDKROOT%" rmdir /s /q "%JDKROOT%"
          mkdir "%JDKROOT%"
          tar.exe -xf "%JDKZIP%" -C "%JDKROOT%"
          if errorlevel 1 exit /b 1
          :jdk_ready
          for /d %%D in ("%JDKROOT%\*") do if exist "%%~fD\bin\javac.exe" echo JAVA_HOME=%%~fD>>"%GITHUB_ENV%"
          for /d %%D in ("%JDKROOT%\*") do if exist "%%~fD\bin\javac.exe" echo %%~fD\bin>>"%GITHUB_PATH%"
          for /d %%D in ("%JDKROOT%\*") do if exist "%%~fD\bin\javac.exe" "%%~fD\bin\java.exe" -version
          for /d %%D in ("%JDKROOT%\*") do if exist "%%~fD\bin\javac.exe" "%%~fD\bin\javac.exe" -version

      - name: Bootstrap Android SDK command-line tools with persistent resume cache
        run: |
          set CACHE=C:\actions-runner\eh7-toolcache
          set SDK=C:\actions-runner\eh7-toolcache\android-sdk
          set SDKZIP=C:\actions-runner\eh7-toolcache\commandlinetools-win-15859902_latest.zip
          set SDKEXTRACT=C:\actions-runner\eh7-toolcache\cmdline-extract
          if not exist "%CACHE%" mkdir "%CACHE%"
          if exist "%SDK%\cmdline-tools\latest\bin\sdkmanager.bat" goto sdk_ready
          if exist "%SDKZIP%.complete" goto sdk_downloaded
          curl.exe -fL -C - --retry 50 --retry-all-errors --retry-delay 3 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%SDKZIP%"
          if errorlevel 1 exit /b 1
          certutil -hashfile "%SDKZIP%" SHA256 | findstr /i "90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" >nul
          if errorlevel 1 exit /b 1
          echo complete>"%SDKZIP%.complete"
          :sdk_downloaded
          if exist "%SDKEXTRACT%" rmdir /s /q "%SDKEXTRACT%"
          mkdir "%SDKEXTRACT%"
          tar.exe -xf "%SDKZIP%" -C "%SDKEXTRACT%"
          if errorlevel 1 exit /b 1
          if not exist "%SDK%\cmdline-tools\latest" mkdir "%SDK%\cmdline-tools\latest"
          xcopy /e /i /y "%SDKEXTRACT%\cmdline-tools\*" "%SDK%\cmdline-tools\latest\" >nul
          if errorlevel 1 exit /b 1
          :sdk_ready
          echo ANDROID_HOME=%SDK%>>"%GITHUB_ENV%"
          echo ANDROID_SDK_ROOT=%SDK%>>"%GITHUB_ENV%"
          echo %SDK%\cmdline-tools\latest\bin>>"%GITHUB_PATH%"
          echo %SDK%\platform-tools>>"%GITHUB_PATH%"
          "%SDK%\cmdline-tools\latest\bin\sdkmanager.bat" --version

      - name: Accept Android licenses and install SDK packages with retry
        run: |
          set SDKMANAGER=%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat
          set LICENSE_INPUT=%RUNNER_TEMP%\android-license-input.txt
          if exist "%LICENSE_INPUT%" del /q "%LICENSE_INPUT%"
          for /l %%i in (1,1,100) do @echo y>>"%LICENSE_INPUT%"
          call "%SDKMANAGER%" --licenses < "%LICENSE_INPUT%"
          if errorlevel 1 exit /b 1
          call :install_package "build-tools;35.0.0"
          if errorlevel 1 exit /b 1
          call :install_package "build-tools;36.0.0"
          if errorlevel 1 exit /b 1
          call :install_package "platforms;android-35"
          if errorlevel 1 exit /b 1
          call :install_package "platforms;android-36"
          if errorlevel 1 exit /b 1
          call :install_package "platform-tools"
          if errorlevel 1 exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\platforms\android-35\android.jar" exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\platforms\android-36\android.jar" exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\build-tools\35.0.0\aapt2.exe" exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\build-tools\36.0.0\aapt2.exe" exit /b 1
          goto sdk_packages_done
          :install_package
          set PKG=%~1
          set ATTEMPT=0
          :install_retry
          set /a ATTEMPT+=1
          echo Installing %PKG% - attempt %ATTEMPT% of 12
          call "%SDKMANAGER%" "%PKG%"
          if not errorlevel 1 exit /b 0
          if %ATTEMPT% GEQ 12 exit /b 1
          timeout /t 8 /nobreak >nul
          goto install_retry
          :sdk_packages_done
          echo Android SDK packages verified.

      - name: Bootstrap Flutter 3.44.9 with persistent resume cache
        run: |
          set CACHE=C:\actions-runner\eh7-toolcache
          set FLUTTERZIP=C:\actions-runner\eh7-toolcache\flutter_windows_3.44.9-stable.zip
          set FLUTTERROOT=C:\actions-runner\eh7-toolcache\flutter-3.44.9
          if not exist "%CACHE%" mkdir "%CACHE%"
          if exist "%FLUTTERROOT%\flutter\bin\flutter.bat" goto flutter_ready
          if exist "%FLUTTERZIP%.complete" goto flutter_downloaded
          curl.exe -fL -C - --retry 100 --retry-all-errors --retry-delay 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.9-stable.zip" -o "%FLUTTERZIP%"
          if errorlevel 1 exit /b 1
          echo complete>"%FLUTTERZIP%.complete"
          :flutter_downloaded
          if exist "%FLUTTERROOT%" rmdir /s /q "%FLUTTERROOT%"
          mkdir "%FLUTTERROOT%"
          tar.exe -xf "%FLUTTERZIP%" -C "%FLUTTERROOT%"
          if errorlevel 1 exit /b 1
          :flutter_ready
          git config --global --add safe.directory "%FLUTTERROOT%\flutter"
          echo %FLUTTERROOT%\flutter\bin>>"%GITHUB_PATH%"
          "%FLUTTERROOT%\flutter\bin\flutter.bat" --version
          "%FLUTTERROOT%\flutter\bin\flutter.bat" config --no-analytics

      - name: Verify Flutter toolchain
        run: |
          flutter.bat config --android-sdk "%ANDROID_SDK_ROOT%"
          flutter.bat --version
          flutter.bat doctor -v

      - name: Dependencies
        working-directory: flutter-app
        run: flutter.bat pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter.bat analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter.bat test

      - name: Build APK with network retry
        working-directory: flutter-app
        run: |
          set BUILD_TRY=0
          :retry_apk
          set /a BUILD_TRY+=1
          echo APK build attempt %BUILD_TRY% of 5
          call flutter.bat build apk --debug --build-name=7.4.0 --build-number=740 --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 --dart-define=EH7_ENVIRONMENT=uat
          if not errorlevel 1 goto apk_ok
          if %BUILD_TRY% GEQ 5 exit /b 1
          timeout /t 10 /nobreak >nul
          goto retry_apk
          :apk_ok
          echo APK build completed.

      - name: Verify APK and SHA256
        run: |
          if not exist "flutter-app\build\app\outputs\flutter-apk\app-debug.apk" exit /b 1
          if not exist "dist\flutter-v7.4.0" mkdir "dist\flutter-v7.4.0"
          copy /y "flutter-app\build\app\outputs\flutter-apk\app-debug.apk" "dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk"
          for %%A in ("dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk") do if %%~zA LEQ 0 exit /b 1
          certutil -hashfile "dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk" SHA256 > "dist\flutter-v7.4.0\APK-SHA256.txt"
          type "dist\flutter-v7.4.0\APK-SHA256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error
