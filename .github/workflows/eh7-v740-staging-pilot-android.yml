name: EH7 v7.4.0 Android Staging Pilot

on:
  push:
    branches: [codex/erp735-document-integration]
  workflow_dispatch:
    inputs:
      staging_api_base_url:
        description: 'HTTPS ERP API base URL for a controlled staging/UAT site'
        required: true
        type: string
      allow_office_target:
        description: 'Explicitly allow office.excelherbal.in as the pilot target'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android-staging-pilot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-android-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PILOT_API: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_api_base_url || 'https://office.excelherbal.in/wp-json/excel-herbal-erp/v7' }}
      ALLOW_OFFICE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_office_target || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate controlled staging target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:PILOT_API
          if ($uri.Scheme -ne 'https') { throw 'Pilot API must use HTTPS.' }
          if (-not $uri.AbsolutePath.TrimEnd('/').EndsWith('/wp-json/excel-herbal-erp/v7')) {
            throw 'Pilot API must point to /wp-json/excel-herbal-erp/v7.'
          }
          if ($uri.Host -ieq 'office.excelherbal.in' -and $env:ALLOW_OFFICE -ne 'true') {
            throw 'Office target requires explicit BUILD/UAT acknowledgement.'
          }
          Write-Host "Pilot target validated: $($uri.Host)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Dependencies and lockfile check
        working-directory: flutter-app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Build ARM64 UAT debug APK
        working-directory: flutter-app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --split-per-abi \
            --dart-define=EH7_API_BASE_URL="$PILOT_API" \
            --dart-define=EH7_ENVIRONMENT=uat

      - name: Stage pilot artifact and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk='flutter-app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk'
          test -f "$apk"
          out='dist/android-staging-pilot'
          rm -rf "$out"
          mkdir -p "$out"
          cp "$apk" "$out/Excel-Herbal-ERP-v7.4.0-Staging-Pilot-arm64.apk"
          hash=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo "commit=$GITHUB_SHA"
            echo "environment=uat"
            echo "api_base_url=$PILOT_API"
            echo "sha256=$hash"
            echo "production_signed=false"
            echo "abi=arm64-v8a"
            echo "purpose=physical-device staging/UAT only"
          } > "$out/PILOT-METADATA.txt"
          cat "$out/PILOT-METADATA.txt"

      - name: Upload Android staging pilot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Excel-Herbal-ERP-v7.4.0-Android-Staging-Pilot-arm64
          path: dist/android-staging-pilot/*
          if-no-files-found: error
          compression-level: 0
