name: EH7 v7.4.0 Android Emulator UAT

on:
  push:
    branches: [codex/erp735-document-integration]
  workflow_dispatch:
    inputs:
      staging_api_base_url:
        description: 'HTTPS ERP API base URL used to build the UAT APK'
        required: true
        default: 'https://office.excelherbal.in/wp-json/excel-herbal-erp/v7'
        type: string

permissions:
  contents: read

jobs:
  android-emulator-uat:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-android-emulator-uat]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PILOT_API: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_api_base_url || 'https://office.excelherbal.in/wp-json/excel-herbal-erp/v7' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate UAT API target
        shell: bash
        run: |
          set -euo pipefail
          case "$PILOT_API" in
            https://*/wp-json/excel-herbal-erp/v7) ;;
            *) echo "Invalid HTTPS ERP API base: $PILOT_API" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error "$PILOT_API/health" > /tmp/eh7-health.json
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/eh7-health.json
          cat /tmp/eh7-health.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Dependencies and lockfile check
        working-directory: flutter-app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: GPS policy unit tests
        working-directory: flutter-app
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/gps_tracking_service_test.dart

      - name: Build Android x86_64 UAT debug APK
        working-directory: flutter-app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-x64             --dart-define=EH7_API_BASE_URL="$PILOT_API"             --dart-define=EH7_ENVIRONMENT=uat
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Stage APK and free hosted-runner disk for emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-emulator-uat
          cp flutter-app/build/app/outputs/flutter-apk/app-debug.apk dist/android-emulator-uat/Excel-Herbal-ERP-Emulator-UAT.apk
          rm -rf flutter-app/build
          rm -rf "$HOME/.gradle/caches" || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          docker system prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h /

      - name: Android emulator permission, GPS and lifecycle smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android-emulator-gps-smoke.sh dist/android-emulator-uat/Excel-Herbal-ERP-Emulator-UAT.apk

      - name: Upload Android emulator UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EH7-v7.4.0-Android-Emulator-UAT-Evidence
          path: |
            dist/android-emulator-uat/EVIDENCE.json
            dist/android-emulator-uat/logcat.txt
            dist/android-emulator-uat/final-screen.png
          if-no-files-found: warn
