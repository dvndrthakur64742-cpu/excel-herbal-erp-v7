name: EH7 v7.4 P2 Effective Date Fix

on:
  push:
    branches:
      - v740-p2-commercial-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply effective-date fix
        run: python3 .github/scripts/p2_effective_date_fix.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format
        working-directory: flutter-app
        run: dart format lib/screens/organization/organization_screen.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Remove one-shot machinery
        run: rm -f .github/workflows/eh7-v740-p2-effective-date-fix.yml .github/scripts/p2_effective_date_fix.py

      - name: Commit validated effective-date fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A flutter-app/lib/screens/organization/organization_screen.dart .github/workflows/eh7-v740-p2-effective-date-fix.yml .github/scripts/p2_effective_date_fix.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Preserve same-day commercial revision precedence'
            git push origin HEAD:v740-p2-commercial-integrity
          fi
