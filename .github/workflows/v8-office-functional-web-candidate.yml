name: Excel Herbal V8 Office Functional Web Candidate (Controlled Staging Install)
run-name: "V8 STAGING FUNCTIONAL WEB ZIP | ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [codex/erp-v8-foundation-20261017]
    paths:
      - '.github/workflows/v8-office-functional-web-candidate.yml'
      - '.github/scripts/package_v8_functional_web.py'
      - '.github/scripts/test_package_v8_functional_web.py'
      - 'flutter-app/**'

permissions:
  contents: read

concurrency:
  group: v8-office-functional-web-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-staging-web-only:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source HEAD and safe web-only packaging
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f flutter-app/lib/core/preview_read_only_policy.dart
          grep -q 'PreviewReadOnlyPolicy.permits' flutter-app/lib/core/api_client.dart
          grep -q 'PreviewReadOnlyPolicy.enabled' flutter-app/lib/main.dart
          python3 -m unittest discover -s .github/scripts -p 'test_package_v8_functional_web.py' -v
      - name: Install Flutter SDK 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Analyze and test business UI (no Office writes)
        working-directory: flutter-app
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build staging FUNCTIONAL web for the installed canonical V7 REST API
        working-directory: flutter-app
        run: |
          flutter build web --release --no-pub \
            --base-href /wp-content/uploads/eh7-flutter-web/ \
            --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 \
            --dart-define=EH7_ENVIRONMENT=staging \
            --dart-define=EH7_PREVIEW_READ_ONLY=false
      - name: Certify a manifest-signed web-only ZIP (NO deployment)
        run: |
          python3 .github/scripts/package_v8_functional_web.py --source-head "$GITHUB_SHA"
      - name: Prepare corruption-resistant ASCII transport for Office Windows runner
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root=Path('dist/v8-office-functional-web')
          raw=(root/'Excel-Herbal-ERP-V8-Office-Functional-Web.zip').read_bytes()
          target=root/'ascii-transport'
          target.mkdir(parents=True,exist_ok=True)
          chunks=[raw[i:i+786432] for i in range(0,len(raw),786432)]
          assert 0<len(chunks)<200
          for i,chunk in enumerate(chunks):
              (target/f'part-{i:04d}.txt').write_text(base64.b64encode(chunk).decode('ascii'),encoding='ascii')
          (target/'transport-sha256.txt').write_text(
              f'SOURCE {os.environ["CANDIDATE_SHA"]}\n'
              f'ZIP_SHA256 {hashlib.sha256(raw).hexdigest()}\n'
              f'ZIP_BYTES {len(raw)}\n'
              f'CHUNKS {len(chunks)}\n',encoding='ascii')
          assert b''.join(base64.b64decode((target/f'part-{i:04d}.txt').read_text()) for i in range(len(chunks)))==raw
          print('PASS verified ASCII staging transport chunks:',len(chunks))
          PY
      - name: Publish ready-to-install ZIP and SHA manifest
        uses: actions/upload-artifact@v4
        with:
          name: ExcelHerbal-V8-Office-Functional-Web-${{ github.sha }}
          path: dist/v8-office-functional-web/
          if-no-files-found: error
          retention-days: 14

  install-owner-approved-office-staging:
    # All normal pushes and manual candidate builds remain BUILD ONLY.
    # One exact owner-requested commit marker permits this one-shot Office job.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[owner-approved-office-v8-functional-web]')
    needs: [certify-staging-web-only]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 80
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      OFFICE_UAT_SITE: https://office.excelherbal.in
      CURRENT_BACKEND_SHA: 95a9e2806edef95257cd6b6aee6f1d56ca632d6b
      OLD_WEB_SOURCE_HEAD: 12d74a520471807e2a7a8f8521abbfdbd73573a8
      OLD_WEB_SHA256: 07eda6ed7f2e963ee0147274543b497e753ec4da990a5324accfcb04298aeea8
    steps:
      - uses: actions/checkout@v4
      - name: Require exact Office staging backend and unmodified old web
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF -cne 'refs/heads/codex/erp-v8-foundation-20261017'){throw 'Not the approved V8 development branch'}
          if((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'Stale source HEAD'}
          $url=$env:OFFICE_UAT_SITE+'/wp-json/excel-herbal-erp/v7/health'
          $raw=& curl.exe --fail --silent --show-error --connect-timeout 10 --max-time 30 $url
          if($LASTEXITCODE -ne 0){throw 'Office staging health not available. No deploy.'}
          $h=($raw -join [Environment]::NewLine)|ConvertFrom-Json
          if($h.ok -ne $true -or $h.data.environment -cne 'staging' -or
             $h.data.source_head -cne $env:CURRENT_BACKEND_SHA -or
             $h.data.schema_installed -ne $true -or
             $h.data.host_hardening.status -cne 'passed' -or
             $h.data.web_runtime.source_head -cne $env:OLD_WEB_SOURCE_HEAD -or
             $h.data.web_runtime.main_sha256 -cne $env:OLD_WEB_SHA256){
            throw 'Office site changed after verified baseline. No upload.'
          }
          Write-Host 'PASS exact no-write baseline: staging, canonical backend and existing frontend.'
      - name: Require interactive authenticated WordPress desktop environment
        run: |
          $ErrorActionPreference='Stop'
          $session=(Get-Process -Id $PID -ErrorAction Stop).SessionId
          $chrome=@(Get-Process chrome -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne [IntPtr]::Zero})
          if($session -eq 0 -or $chrome.Count -eq 0){throw 'No unlocked Chrome desktop session; no site mutation.'}
          foreach($source in @('.github/scripts/deploy-v8-office-web-preview.ps1','.github/scripts/restore-v8-office-zip.ps1','.github/scripts/stage-v8-office-web-preview-zip.ps1')){
            $tokens=$null;$errorsFound=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $source),[ref]$tokens,[ref]$errorsFound)
            if($errorsFound.Count -gt 0){throw ('Invalid deployment script: '+$source)}
          }
          Write-Host 'PASS interactive runner available; WordPress authentication independently checked before upload.'
      - name: Download exact commit functional-web artifact
        uses: actions/download-artifact@v4
        with:
          name: ExcelHerbal-V8-Office-Functional-Web-${{ github.sha }}
          path: dist/office-functional-web/
      - name: Verify candidate release manifest and restore byte-identical ZIP
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'dist/office-functional-web'
          $manifest=Get-Content -LiteralPath (Join-Path $root 'V8-FUNCTIONAL-WEB-MANIFEST.json') -Raw | ConvertFrom-Json
          if($manifest.release -cne 'v8-office-functional-web-candidate' -or
             $manifest.source_head -cne $env:GITHUB_SHA -or
             $manifest.environment -cne 'staging' -or
             $manifest.site -cne $env:OFFICE_UAT_SITE -or
             $manifest.api_base_url -cne ($env:OFFICE_UAT_SITE+'/wp-json/excel-herbal-erp/v7') -or
             $manifest.preview_read_only -ne $false -or
             $manifest.backend_or_database_included -ne $false -or
             $manifest.wordpress_deployment_performed -ne $false){
            throw 'Wrong release type: refusing PHP/database or read-only candidate.'
          }
          $restored=Join-Path $env:RUNNER_TEMP ('office-functional-'+$env:GITHUB_SHA+'.zip')
          & '.github/scripts/restore-v8-office-zip.ps1' -SourceHead $env:GITHUB_SHA -TransportDir (Join-Path $root 'ascii-transport') -OutputZip $restored
          if((Get-FileHash -LiteralPath $restored -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.zip_sha256){throw 'Transport differs from signed functional ZIP'}
          & '.github/scripts/stage-v8-office-web-preview-zip.ps1' -SourceHead $env:GITHUB_SHA -ArchivePath $restored
          $attempt=if($env:GITHUB_RUN_ATTEMPT){$env:GITHUB_RUN_ATTEMPT}else{'1'}
          $slot=$env:GITHUB_SHA+'-run'+$env:GITHUB_RUN_ID+'-attempt'+$attempt+'-slot-v8-office-preview'
          $webJs=Join-Path $env:USERPROFILE ('ERP7-Releases\uat-candidates\'+$slot+'\web\main.dart.js')
          if((Get-FileHash -LiteralPath $webJs -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.main_js_sha256){throw 'Functional JS differs from candidate manifest'}
          Write-Host 'PASS signed write-enabled web ZIP staged; no backend or DB files.'
      - name: Submit once through authenticated WordPress UAT web form
        run: |
          & '.github/scripts/deploy-v8-office-web-preview.ps1' -SourceHead $env:GITHUB_SHA -UatSiteUrl $env:OFFICE_UAT_SITE -AuditReason 'Owner requested functional V8 staging web UAT; existing backend and DB retained'
      - name: Independently attest live JS SHA and unchanged backend after upload
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -LiteralPath 'dist/office-functional-web/V8-FUNCTIONAL-WEB-MANIFEST.json' -Raw | ConvertFrom-Json
          $web=Join-Path $env:RUNNER_TEMP ('functional-web-live-'+[Guid]::NewGuid().ToString('N')+'.js')
          try {
            $uri=$env:OFFICE_UAT_SITE+'/wp-content/uploads/eh7-flutter-web/main.dart.js?check='+[Guid]::NewGuid().ToString('N')
            & curl.exe --fail --silent --show-error --location --connect-timeout 15 --max-time 120 --output $web $uri
            if($LASTEXITCODE -ne 0){throw 'Cannot independently download installed web JS'}
            if((Get-FileHash -LiteralPath $web -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.main_js_sha256){throw 'Installed JS SHA differs from signed candidate'}
            $raw=& curl.exe --fail --silent --show-error --max-time 25 ($env:OFFICE_UAT_SITE+'/wp-json/excel-herbal-erp/v7/health')
            if($LASTEXITCODE -ne 0){throw 'Post-install Office health unavailable'}
            $h=($raw -join [Environment]::NewLine)|ConvertFrom-Json
            if($h.ok -ne $true -or $h.data.environment -cne 'staging' -or
               $h.data.source_head -cne $env:CURRENT_BACKEND_SHA -or
               $h.data.schema_installed -ne $true -or
               $h.data.web_runtime.source_head -cne $env:GITHUB_SHA -or
               $h.data.web_runtime.main_sha256 -cne $manifest.main_js_sha256){
              throw 'Installed source/main hash or unchanged backend attestation failed.'
            }
            Write-Host ('PASS Office V8 functional web installed, source '+$env:GITHUB_SHA)
            Write-Host ('PASS actual live JS SHA '+$manifest.main_js_sha256)
            Write-Host ('PASS canonical PHP backend unchanged '+$env:CURRENT_BACKEND_SHA)
            Write-Host 'Authenticated Employee to ASM business-flow acceptance remains separate.'
          }finally{Remove-Item -LiteralPath $web -Force -ErrorAction SilentlyContinue}

# Never push an approval marker in ordinary UI commits. An approved attempt
# stays fail-closed on changed site hash, missing signed artifact, unavailable
# interactive WordPress admin, invalid native form, or mismatched live output.
