name: EH7 v7.4.0 Isolated Backup Restore UAT

on:
  workflow_dispatch:
  push:
    branches: [codex/erp735-document-integration, codex/reports-date-export-workflow]

permissions:
  contents: read

jobs:
  isolated-backup-restore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-backup-restore-uat]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify isolated recovery runner prerequisites
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = 'C:\actions-runner\eh7-toolcache'
          if (-not (Test-Path -LiteralPath $toolRoot -PathType Container)) {
            New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          }
          if (-not (Test-Path -LiteralPath (Join-Path $toolRoot 'php-8.3.33\php.exe') -PathType Leaf)) {
            Write-Host 'PHP 8.3.33 will be downloaded by the isolated harness and checksum-verified.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $toolRoot 'mariadb-11.8.9\bin\mariadbd.exe') -PathType Leaf)) {
            Write-Host 'MariaDB 11.8.9 will be downloaded by the isolated harness and checksum-verified.'
          }
          if (-not (Get-Command curl.exe -ErrorAction SilentlyContinue)) {
            throw 'curl.exe is required on the isolated recovery runner.'
          }

      - name: Fresh isolated WordPress + MariaDB backup/restore drill
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & '.github/scripts/isolated-backup-restore-uat.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload backup/restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EH7-v7.4.0-Isolated-Backup-Restore-Evidence
          path: |
            dist/isolated-backup-restore/EVIDENCE.json
            dist/isolated-backup-restore/bootstrap.json
            dist/isolated-backup-restore/FAILURE.json
          if-no-files-found: warn
