name: EH7 v7.4 P3 Mobile Density

on:
  push:
    branches:
      - v740-p3-mobile-density
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact Daily Order layouts
        run: python3 .github/scripts/p3_mobile_density_patch.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format
        working-directory: flutter-app
        run: dart format lib/screens/my_work/my_work_screen.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: flutter build apk --debug

      - name: Remove one-shot machinery
        run: rm -f .github/workflows/eh7-v740-p3-mobile-density.yml .github/scripts/p3_mobile_density_patch.py

      - name: Commit validated P3 mobile density
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A flutter-app/lib/screens/my_work/my_work_screen.dart .github/workflows/eh7-v740-p3-mobile-density.yml .github/scripts/p3_mobile_density_patch.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Compact Daily Order mobile product entry layouts'
            git push origin HEAD:v740-p3-mobile-density
          fi
