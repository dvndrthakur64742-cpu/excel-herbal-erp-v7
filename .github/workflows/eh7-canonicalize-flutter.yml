name: EH7 Canonicalize Flutter App

on:
  push:
    branches: [flutter-v720-build]
    paths: ['.github/workflows/eh7-canonicalize-flutter.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified v7.3.1 project
        shell: bash
        run: |
          set -euo pipefail
          cat dist/source.xz.parts/part-*.b64 | base64 -d > /tmp/base.tar.xz
          rm -rf work && mkdir work && tar -xJf /tmp/base.tar.xz -C work
          cd work && patch -p1 --forward --batch < ../ci/clean10-flutter-compile-fix-1.patch && python3 ../ci/clean10-analyzer-cleanup-2.py && cd ..
          cat build-input/flutter-v720.parts3/part-*.b64 | base64 -d > /tmp/a.tar.xz && tar -xJf /tmp/a.tar.xz -C work
          cat build-input/flutter-v720-missing.parts/part-*.b64 | base64 -d > /tmp/b.tar.xz && tar -xJf /tmp/b.tar.xz -C work
          base64 -d build-input/flutter-v720-record-detail.b64 > /tmp/c.tar.xz && tar -xJf /tmp/c.tar.xz -C work
          cat build-input/flutter-v730-brand-small.parts/part-*.b64 | base64 -d > /tmp/d.tar.xz && tar -xJf /tmp/d.tar.xz -C work
          cat build-input/flutter-v730-analyzer-fix.parts/part-*.b64 | base64 -d > /tmp/e.tar.xz && tar -xJf /tmp/e.tar.xz -C work
          cat build-input/flutter-v731-daily-batch-fix.parts/part-*.b64 | base64 -d > /tmp/f.tar.xz && tar -xJf /tmp/f.tar.xz -C work
          cat build-input/flutter-v731-issue-review-fix.parts/part-*.b64 | base64 -d > /tmp/g.tar.xz && tar -xJf /tmp/g.tar.xz -C work
      - name: Create canonical project tree
        shell: bash
        run: |
          set -euo pipefail
          SRC=work/flutter/excel_herbal_erp
          rm -rf flutter-app
          mkdir flutter-app
          for p in android lib test assets tool pubspec.yaml analysis_options.yaml; do
            if [ -e "$SRC/$p" ]; then cp -R "$SRC/$p" flutter-app/; fi
          done
          find flutter-app -type d -name build -prune -exec rm -rf {} + || true
          find flutter-app -type d -name .dart_tool -prune -exec rm -rf {} + || true
          printf '%s\n' '# Canonical Flutter app' 'Verified v7.3.1 source baseline. All future UI/UX and logic fixes should be made here.' > flutter-app/README.md
      - name: Commit canonical project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-app
          git commit -m "Add canonical verified Flutter app source [skip ci]" || exit 0
          git push origin HEAD:flutter-v720-build
