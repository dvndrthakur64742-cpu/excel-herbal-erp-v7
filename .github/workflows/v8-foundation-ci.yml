name: ERP V8 Foundation Checks (No Deploy)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v8/**'
      - '.github/workflows/v8-foundation-ci.yml'

permissions:
  contents: read

jobs:
  php-domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check V8 PHP syntax
        run: |
          php -l v8/backend/src/B2B/RetailerCashSale.php
          php -l v8/backend/tests/run.php
      - name: Run V8 paid-only retailer domain regression
        run: php -d zend.assertions=1 -d assert.exception=1 v8/backend/tests/run.php
