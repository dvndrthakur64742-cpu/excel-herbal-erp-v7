name: EH7 Clean10 Flutter Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Reconstruct SHA-verified canonical Clean10 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/source.xz.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 15
          cat dist/source.xz.parts/part-*.b64 | base64 -d > /tmp/eh7-clean10.tar.xz
          echo "b89b034254702f81b514c08995d3edc345947852b48f43fea4bd6e89e9c13c0a  /tmp/eh7-clean10.tar.xz" | sha256sum -c -
          rm -rf work
          mkdir work
          tar -xJf /tmp/eh7-clean10.tar.xz -C work

      - name: Apply compiler fix overlay
        run: |
          set -euo pipefail
          cd work
          patch -p1 --forward --batch < ../ci/clean10-flutter-compile-fix-1.patch

      - name: Source gates
        working-directory: work
        run: ./tool/verify_source_rc.sh

      - name: Bootstrap Android Gradle wrapper
        working-directory: work
        run: ./tool/bootstrap_android_wrapper.sh

      - name: Flutter dependencies
        working-directory: work/flutter/excel_herbal_erp
        run: flutter pub get

      - name: Flutter analyze
        working-directory: work/flutter/excel_herbal_erp
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        working-directory: work/flutter/excel_herbal_erp
        run: flutter test

      - name: Build office UAT debug APK
        working-directory: work/flutter/excel_herbal_erp
        run: |
          flutter build apk --debug \
            --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 \
            --dart-define=EH7_ENVIRONMENT=uat
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee ../../../APK-SHA256.txt

      - name: Upload office UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: eh7-office-uat-debug-apk
          path: |
            work/flutter/excel_herbal_erp/build/app/outputs/flutter-apk/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
