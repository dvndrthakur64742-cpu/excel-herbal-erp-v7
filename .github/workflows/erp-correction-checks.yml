name: ERP correction verification
on:
  push:
    branches: [codex/erp735-document-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-correction-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # Limit execution-policy override to each CI process; do not change machine policy.
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
jobs:
  php-regression:
    if: github.ref == 'refs/heads/codex/erp735-document-integration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate fail-closed release gate policy
        run: |
          & '.github/scripts/verify-release-gates.ps1' -Mode ci -GateFile 'release-gates/v7.4.0.json'
      - name: Parse release and staging PowerShell scripts
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem '.github\scripts' -Filter '*.ps1' -File)
          if ($files.Count -eq 0) { throw 'No release/staging PowerShell scripts found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              throw "PowerShell parse failed: $($file.Name)"
            }
            Write-Host "PASS powershell_parse $($file.Name)"
          }
      - name: Locate or install verified PHP 8.3.33 toolcache
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $toolRoot = 'C:\actions-runner\eh7-toolcache'
          $phpDir = Join-Path $toolRoot 'php-8.3.33'
          $phpExe = Join-Path $phpDir 'php.exe'
          if (-not (Test-Path -LiteralPath $phpExe -PathType Leaf)) {
            New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
            if (Test-Path -LiteralPath $phpDir) { Remove-Item -LiteralPath $phpDir -Recurse -Force }
            $archive = Join-Path $env:RUNNER_TEMP 'eh7-php-8.3.33.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://downloads.php.net/~windows/releases/archives/php-8.3.33-nts-Win32-vs16-x64.zip' -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '534399107056313246f424adbbb7937337e40fbbf6aa7bc26287ba9cfd2e4a2a') {
              throw 'PHP archive checksum mismatch.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $phpDir -Force
          }
          & $phpExe -n --version
          if ($LASTEXITCODE -ne 0) { throw 'Cached PHP failed to start. Check the Visual C++ runtime on the runner.' }
          "EH7_PHP_EXE=$phpExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Locate PHP 8.1 or newer
        run: |
          $ErrorActionPreference = 'Stop'
          $phpCommand = Get-Command php.exe -ErrorAction SilentlyContinue
          $candidates = @($env:EH7_PHP_EXE)
          if ($phpCommand) { $candidates += $phpCommand.Source }
          $candidates += @('C:\actions-runner\eh7-toolcache\php-8.3.33\php.exe', 'C:\php\php.exe', 'C:\xampp\php\php.exe')
          $phpExe = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $phpExe) { throw 'PHP 8.1+ was not found. Install PHP CLI on ERP-PC and set EH7_PHP_EXE or add php.exe to the runner PATH, then restart the runner.' }
          & $phpExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $phpExe -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
          if ($LASTEXITCODE -ne 0) { throw 'PHP 8.1+ is required.' }
          "EH7_PHP_EXE=$phpExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: PHP lint and 33 regression cases
        working-directory: backend/excel-herbal-erp-v7
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem src,tests -Recurse -Filter *.php -File)
          $files += Get-Item excel-herbal-erp-v7.php
          foreach ($file in $files) {
            & $env:EH7_PHP_EXE -l $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:EH7_PHP_EXE tests/regression.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Route and contract checks
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $toolRoot = 'C:\actions-runner\eh7-toolcache'
          $pythonDir = Join-Path $toolRoot 'python-3.13.7-embed'
          $pythonExe = Join-Path $pythonDir 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
            New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
            if (Test-Path -LiteralPath $pythonDir) { Remove-Item -LiteralPath $pythonDir -Recurse -Force }
            $archive = Join-Path $env:RUNNER_TEMP 'eh7-python-3.13.7.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip' -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm MD5).Hash -ne '77f294ec267596827a2ab06e8fa3f18c') {
              throw 'Python archive checksum mismatch.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $pythonDir -Force
          }
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Cached Python failed to start.' }
          & $pythonExe backend/excel-herbal-erp-v7/tests/static_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Disposable MariaDB 11.8.9 integration
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $toolRoot = 'C:\actions-runner\eh7-toolcache'
          $mariaRoot = Join-Path $toolRoot 'mariadb-11.8.9'
          $serverExe = Join-Path $mariaRoot 'bin\mariadbd.exe'
          $serverProcess = $null
          $dataDir = Join-Path $env:RUNNER_TEMP ('eh7-mariadb-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $serverOut = Join-Path $env:RUNNER_TEMP 'eh7-mariadb.stdout.log'
          $serverErr = Join-Path $env:RUNNER_TEMP 'eh7-mariadb.stderr.log'
          $previousPhpRc = $env:PHPRC
          try {
            if (-not (Test-Path -LiteralPath $serverExe -PathType Leaf)) {
              New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
              if (Test-Path -LiteralPath $mariaRoot) { Remove-Item -LiteralPath $mariaRoot -Recurse -Force }
              $fileEndpoint = 'https://downloads.mariadb.org/rest-api/mariadb/11.8.9/mariadb-11.8.9-winx64.zip'
              $checksum = Invoke-RestMethod -UseBasicParsing -Uri ($fileEndpoint + '/checksum')
              $expected = ([string]$checksum.response.checksum.sha256sum).ToLowerInvariant()
              if ($expected.Length -ne 64 -or $expected -notmatch '^[0-9a-f]+$') { throw 'MariaDB SHA-256 metadata is missing or invalid.' }
              $downloadDir = Join-Path $toolRoot 'downloads'
              New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
              $archive = Join-Path $downloadDir 'mariadb-11.8.9-winx64.zip'
              $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
              if (-not $curl) { throw 'curl.exe is required for resumable MariaDB toolcache download.' }
              & $curl.Source --fail --location --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 30 --continue-at - --output $archive $fileEndpoint
              if ($LASTEXITCODE -ne 0) { throw 'MariaDB resumable download failed.' }
              $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                throw 'MariaDB archive checksum mismatch; cached partial archive was removed.'
              }
              $extractRoot = Join-Path $env:RUNNER_TEMP 'eh7-mariadb-extract'
              if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
              Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
              $found = Get-ChildItem -LiteralPath $extractRoot -Recurse -Filter mariadbd.exe -File | Select-Object -First 1
              if (-not $found) { throw 'mariadbd.exe was not found in the verified MariaDB archive.' }
              $expandedRoot = Split-Path (Split-Path $found.FullName -Parent) -Parent
              Move-Item -LiteralPath $expandedRoot -Destination $mariaRoot
              $serverExe = Join-Path $mariaRoot 'bin\mariadbd.exe'
            }

            $installExe = @(
              (Join-Path $mariaRoot 'bin\mariadb-install-db.exe'),
              (Join-Path $mariaRoot 'bin\mysql_install_db.exe')
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            $clientExe = Join-Path $mariaRoot 'bin\mariadb.exe'
            $adminExe = Join-Path $mariaRoot 'bin\mariadb-admin.exe'
            $dumpExe = Join-Path $mariaRoot 'bin\mariadb-dump.exe'
            if (-not $installExe -or -not (Test-Path -LiteralPath $clientExe) -or -not (Test-Path -LiteralPath $adminExe) -or -not (Test-Path -LiteralPath $dumpExe)) {
              throw 'MariaDB portable tools are incomplete.'
            }

            if (Test-Path -LiteralPath $dataDir) { Remove-Item -LiteralPath $dataDir -Recurse -Force }
            $port = Get-Random -Minimum 34000 -Maximum 34999
            $rootPassword = [guid]::NewGuid().ToString('N')
            & $installExe "--datadir=$dataDir" "--password=$rootPassword" "--port=$port" --allow-remote-root-access
            if ($LASTEXITCODE -ne 0) { throw 'MariaDB temporary data directory initialization failed.' }
            $defaultsFile = Join-Path $dataDir 'my.ini'
            if (-not (Test-Path -LiteralPath $defaultsFile -PathType Leaf)) { throw 'MariaDB temporary my.ini was not generated.' }

            $serverProcess = Start-Process -FilePath $serverExe -ArgumentList @(
              "--defaults-file=$defaultsFile",
              '--console',
              '--bind-address=127.0.0.1'
            ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr

            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              if ($serverProcess.HasExited) { break }
              & $adminExe --host=127.0.0.1 "--port=$port" --user=root "--password=$rootPassword" ping --silent 2>$null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $serverErr) { Get-Content -LiteralPath $serverErr -Tail 80 }
              throw 'Disposable MariaDB server did not become ready.'
            }

            $database = 'eh7_integration_' + $env:GITHUB_RUN_ID + '_' + $env:GITHUB_RUN_ATTEMPT
            & $clientExe --host=127.0.0.1 "--port=$port" --user=root "--password=$rootPassword" -e "CREATE DATABASE $database CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            if ($LASTEXITCODE -ne 0) { throw 'Disposable integration database could not be created.' }

            $env:EH7_MARIADB_HOST = '127.0.0.1'
            $env:EH7_MARIADB_PORT = [string]$port
            $env:EH7_MARIADB_USER = 'root'
            $env:EH7_MARIADB_PASSWORD = $rootPassword
            $env:EH7_MARIADB_DATABASE = $database

            $phpDir = Split-Path $env:EH7_PHP_EXE -Parent
            $extensionDir = (Join-Path $phpDir 'ext').Replace('\','/')
            $phpIni = Join-Path $env:RUNNER_TEMP 'eh7-mariadb-php.ini'
            @(
              ('extension_dir="' + $extensionDir + '"'),
              'extension=mysqli',
              'extension=openssl',
              'extension=fileinfo'
            ) | Set-Content -LiteralPath $phpIni -Encoding ascii
            $env:PHPRC = $phpIni
            & $env:EH7_PHP_EXE -r "if (!extension_loaded('mysqli')) { fwrite(STDERR, 'mysqli extension unavailable'); exit(7); } if (!function_exists('openssl_encrypt') || !function_exists('openssl_decrypt')) { fwrite(STDERR, 'OpenSSL extension unavailable'); exit(8); } if (!class_exists('finfo')) { fwrite(STDERR, 'fileinfo extension unavailable'); exit(9); }"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_mariadb.php
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_business_concurrency.php
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_recovery_security.php auth
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_recovery_security.php seed-document-recovery
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $backupFile = Join-Path $env:RUNNER_TEMP ('eh7-recovery-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '.sql')
            $backupErr = Join-Path $env:RUNNER_TEMP 'eh7-recovery-dump.stderr.log'
            $restoreErr = Join-Path $env:RUNNER_TEMP 'eh7-recovery-restore.stderr.log'
            $dumpProcess = Start-Process -FilePath $dumpExe -ArgumentList @(
              '--host=127.0.0.1',
              "--port=$port",
              '--user=root',
              "--password=$rootPassword",
              '--single-transaction',
              '--quick',
              '--skip-lock-tables',
              '--default-character-set=utf8mb4',
              '--databases',
              $database
            ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $backupFile -RedirectStandardError $backupErr
            if ($dumpProcess.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $backupErr) { Get-Content -LiteralPath $backupErr -Tail 80 }
              throw 'Disposable recovery backup export failed.'
            }
            if (-not (Test-Path -LiteralPath $backupFile -PathType Leaf) -or (Get-Item -LiteralPath $backupFile).Length -lt 1024) {
              throw 'Disposable recovery backup is missing or unexpectedly small.'
            }
            $backupHash = (Get-FileHash -LiteralPath $backupFile -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "INFO recovery_backup_sha256=$backupHash"

            & $clientExe --host=127.0.0.1 "--port=$port" --user=root "--password=$rootPassword" -e "DROP DATABASE $database;"
            if ($LASTEXITCODE -ne 0) { throw 'Disposable recovery database drop failed.' }

            $restoreProcess = Start-Process -FilePath $clientExe -ArgumentList @(
              '--host=127.0.0.1',
              "--port=$port",
              '--user=root',
              "--password=$rootPassword",
              '--default-character-set=utf8mb4'
            ) -Wait -PassThru -NoNewWindow -RedirectStandardInput $backupFile -RedirectStandardError $restoreErr
            if ($restoreProcess.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $restoreErr) { Get-Content -LiteralPath $restoreErr -Tail 80 }
              throw 'Disposable recovery backup restore failed.'
            }

            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_recovery_security.php verify-document-recovery
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host 'PASS mariadb_backup_restore_roundtrip'

            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_uat_smoke.php
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $env:EH7_PHP_EXE backend/excel-herbal-erp-v7/tests/integration_business_e2e_coverage2.php
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            $env:PHPRC = $previousPhpRc
            if ($serverProcess -and -not $serverProcess.HasExited) {
              Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $serverProcess.Id -ErrorAction SilentlyContinue
            }
            if ($backupFile -and (Test-Path -LiteralPath $backupFile)) {
              Remove-Item -LiteralPath $backupFile -Force -ErrorAction SilentlyContinue
            }
            if ($backupErr -and (Test-Path -LiteralPath $backupErr)) {
              Remove-Item -LiteralPath $backupErr -Force -ErrorAction SilentlyContinue
            }
            if ($restoreErr -and (Test-Path -LiteralPath $restoreErr)) {
              Remove-Item -LiteralPath $restoreErr -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $dataDir) {
              Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
  flutter-integration:
    if: github.ref == 'refs/heads/codex/erp735-document-integration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate existing Flutter toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterExe = 'C:\actions-runner\eh7-toolcache\flutter-3.44.9\flutter\bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            $flutter = Get-Command flutter.bat -ErrorAction SilentlyContinue
            if (-not $flutter) { throw 'Flutter is not available. Start ERP-PC with its existing Flutter toolcache or add flutter.bat to the runner PATH.' }
            $flutterExe = $flutter.Source
          }
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EH7_FLUTTER_EXE=$flutterExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Dependencies
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned dependency lockfile
        working-directory: flutter-app
        run: |
          $ErrorActionPreference = 'Stop'
          git diff -- pubspec.lock
          git diff --quiet -- pubspec.lock
          if ($LASTEXITCODE -ne 0) {
            throw 'pubspec.lock changes under pinned Flutter 3.44.9. Regenerate and commit the lockfile before production certification.'
          }
      - name: Analyze
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        working-directory: flutter-app
        run: |
          & $env:EH7_FLUTTER_EXE test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Production web compile and invariants
        working-directory: flutter-app
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EH7_FLUTTER_EXE build web --release --base-href /wp-content/uploads/eh7-flutter-web/ --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 --dart-define=EH7_ENVIRONMENT=production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $index = 'build/web/index.html'
          $main = 'build/web/main.dart.js'
          if (-not (Test-Path -LiteralPath $index -PathType Leaf)) { throw 'Production web index.html was not generated.' }
          if (-not (Test-Path -LiteralPath $main -PathType Leaf)) { throw 'Production web main.dart.js was not generated.' }
          if (-not (Select-String -LiteralPath $index -SimpleMatch '<html lang="en">' -Quiet)) { throw 'Production web lang metadata is missing.' }
          if (-not (Select-String -LiteralPath $index -SimpleMatch 'Excel Herbal ERP operations portal' -Quiet)) { throw 'Production web meta description is missing.' }
          if (-not (Select-String -LiteralPath $main -SimpleMatch 'office.excelherbal.in/wp-json/excel-herbal-erp/v7' -Quiet)) { throw 'Production API base URL is missing from compiled web output.' }
          if (Select-String -LiteralPath $main -SimpleMatch 'UAT BUILD' -Quiet) { throw 'UAT marker leaked into production web output.' }
      - name: Create production web SHA-256 manifest
        working-directory: flutter-app
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'build/web').Path
          $lines = Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($root.Length + 1).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $lines | Set-Content -LiteralPath 'build/web/SHA256SUMS.txt' -Encoding ascii
          if (-not (Test-Path -LiteralPath 'build/web/SHA256SUMS.txt' -PathType Leaf)) { throw 'Web SHA-256 manifest was not created.' }
      - name: Persist exact-head production web candidate on runner
        working-directory: flutter-app
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:USERPROFILE ('ERP7-Releases\\candidates\\' + $env:GITHUB_SHA)
          $candidateDir = Join-Path $releaseRoot 'web'
          $zipPath = Join-Path $releaseRoot 'Excel-Herbal-ERP-v7.4.0-Web-Candidate.zip'
          if (Test-Path -LiteralPath $releaseRoot) { Remove-Item -LiteralPath $releaseRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $candidateDir -Force | Out-Null
          Copy-Item -Path 'build/web/*' -Destination $candidateDir -Recurse -Force
          Compress-Archive -Path (Join-Path $candidateDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw 'Local production web candidate ZIP was not created.' }
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  Excel-Herbal-ERP-v7.4.0-Web-Candidate.zip" | Set-Content -LiteralPath (Join-Path $releaseRoot 'WEB-CANDIDATE-ZIP-SHA256.txt') -Encoding ascii
          Write-Host "Exact-head web candidate preserved at $releaseRoot"
