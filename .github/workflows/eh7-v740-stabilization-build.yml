name: EH7 Flutter v7.4.0 Stabilization Build

on:
  workflow_dispatch:
  push:
    branches:
      - v7-hierarchy-gps-reporting-dashboard
    paths:
      - '.ci/eh7-windows-certify.trigger'

concurrency:
  group: eh7-v740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify hierarchy/reporting/GPS frontend invariants
        working-directory: flutter-app
        run: python3 tool/finalize_hierarchy_gps_frontend.py

      - name: Verify branch selector state sync
        working-directory: flutter-app
        run: python3 tool/verify_branch_selector_state_sync.py

      - name: Verify Flutter API paths against v7 backend
        working-directory: flutter-app
        run: python3 tool/verify_api_paths_against_backend.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=flutter-app/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          mkdir -p dist/flutter-v7.4.0
          cp "$APK" dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
          sha256sum dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk | tee dist/flutter-v7.4.0/APK-SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error
