name: EH7 v7.4.0 Web Production Build

on:
  workflow_dispatch:
  push:
    branches: [v740-business-completion]
    paths:
      - '.github/workflows/eh7-v740-web-production-build.yml'
      - 'flutter-app/**'

concurrency:
  group: eh7-v740-web-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: 3.44.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Flutter SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          sdk_root="$RUNNER_TEMP/flutter-sdk"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          mkdir -p "$sdk_root"
          tar -xf "$archive" -C "$sdk_root"
          echo "$sdk_root/flutter/bin" >> "$GITHUB_PATH"
          "$sdk_root/flutter/bin/flutter" config --no-analytics
          "$sdk_root/flutter/bin/flutter" config --enable-web
          "$sdk_root/flutter/bin/flutter" --version

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze clean source
        working-directory: flutter-app
        run: flutter analyze

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build production desktop web
        working-directory: flutter-app
        run: >-
          flutter build web --release
          --base-href /wp-content/uploads/eh7-flutter-web/
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=production

      - name: Verify production web invariants
        run: |
          set -euo pipefail
          test -f flutter-app/build/web/index.html
          test -f flutter-app/build/web/flutter_bootstrap.js
          test -f flutter-app/build/web/main.dart.js
          grep -F '<base href="/wp-content/uploads/eh7-flutter-web/">' flutter-app/build/web/index.html
          grep -F 'office.excelherbal.in/wp-json/excel-herbal-erp/v7' flutter-app/build/web/main.dart.js
          if grep -Fq 'UAT BUILD' flutter-app/build/web/main.dart.js; then
            echo 'Production build unexpectedly contains UAT BUILD marker.' >&2
            exit 1
          fi
          grep -F '<html lang="en">' flutter-app/build/web/index.html
          grep -F 'Excel Herbal ERP operations portal' flutter-app/build/web/index.html

      - name: Package production web
        run: |
          set -euo pipefail
          mkdir -p dist/flutter-v7.4.0
          (cd flutter-app/build/web && zip -qr "$GITHUB_WORKSPACE/dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Web-Production.zip" .)
          sha256sum flutter-app/build/web/main.dart.js > dist/flutter-v7.4.0/WEB-PRODUCTION-MAIN-SHA256.txt
          sha256sum dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Web-Production.zip > dist/flutter-v7.4.0/WEB-PRODUCTION-ZIP-SHA256.txt
          printf 'commit=%s\nenvironment=production\n' "$GITHUB_SHA" > dist/flutter-v7.4.0/WEB-PRODUCTION-STATUS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Excel-Herbal-ERP-v7.4.0-Web-Production
          path: dist/flutter-v7.4.0/*
          if-no-files-found: error
