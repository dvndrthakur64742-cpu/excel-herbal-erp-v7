name: EH7 Flutter v7.2.0 Build

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - 'build-input/flutter-v720.parts3/**'
      - 'build-input/flutter-v720-missing.parts/**'
      - 'build-input/flutter-v720-record-detail.b64'
      - '.github/workflows/eh7-v720-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Reconstruct canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/source.xz.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 15
          cat dist/source.xz.parts/part-*.b64 | base64 -d > /tmp/eh7-clean10.tar.xz
          echo "b89b034254702f81b514c08995d3edc345947852b48f43fea4bd6e89e9c13c0a  /tmp/eh7-clean10.tar.xz" | sha256sum -c -
          rm -rf work
          mkdir work
          tar -xJf /tmp/eh7-clean10.tar.xz -C work

      - name: Apply canonical compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          cd work
          patch -p1 --forward --batch < ../ci/clean10-flutter-compile-fix-1.patch
          python3 ../ci/clean10-analyzer-cleanup-2.py

      - name: Apply SHA-verified v7.2.0 Flutter overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-input/flutter-v720.parts3 -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 6
          cat build-input/flutter-v720.parts3/part-*.b64 | base64 -d > /tmp/flutter-v720-overlay.tar.xz
          echo "8c446ef6a7c66575fb29089535eecd74d2ec9996c3effc56cebd47cd5fdb1e62  /tmp/flutter-v720-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-overlay.tar.xz -C work
          test -f work/flutter/excel_herbal_erp/lib/screens/tools/erp_tools_screen.dart
          grep -q "version: 7.2.0+720" work/flutter/excel_herbal_erp/pubspec.yaml

      - name: Apply recovered support files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-input/flutter-v720-missing.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 3
          cat build-input/flutter-v720-missing.parts/part-*.b64 | base64 -d > /tmp/flutter-v720-missing-delta.tar.xz
          echo "f2b77954d97d373b6f39d5a10ebca33ffabde05efba866723157aceb1a7d9a4c  /tmp/flutter-v720-missing-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-missing-delta.tar.xz -C work
          base64 -d build-input/flutter-v720-record-detail.b64 > /tmp/flutter-v720-record-detail-delta.tar.xz
          echo "7dbfe5194ee26dc799d2682bfe49c7d55809a5bf352208e8f11ae24200aa225e  /tmp/flutter-v720-record-detail-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-record-detail-delta.tar.xz -C work
          test -f work/flutter/excel_herbal_erp/lib/core/business_format.dart
          test -f work/flutter/excel_herbal_erp/lib/core/date_time_text.dart
          test -f work/flutter/excel_herbal_erp/lib/core/whole_pcs.dart
          test -f work/flutter/excel_herbal_erp/lib/core/overlay_transition.dart
          test -f work/flutter/excel_herbal_erp/lib/screens/home/enterprise_hub_screen.dart
          test -f work/flutter/excel_herbal_erp/lib/screens/common/record_detail_screen.dart

      - name: Bootstrap Android wrapper
        working-directory: work
        run: ./tool/bootstrap_android_wrapper.sh

      - name: Dependencies
        working-directory: work/flutter/excel_herbal_erp
        run: flutter pub get

      - name: Analyze
        working-directory: work/flutter/excel_herbal_erp
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: work/flutter/excel_herbal_erp
        run: flutter test

      - name: Build UAT debug APK
        working-directory: work/flutter/excel_herbal_erp
        run: >-
          flutter build apk --debug
          --build-name=7.2.0
          --build-number=720
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK identity and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=work/flutter/excel_herbal_erp/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee APK-SHA256-v7.2.0.txt
          mkdir -p dist/flutter-v7.2.0
          cp "$APK" dist/flutter-v7.2.0/Excel-Herbal-ERP-v7.2.0-UAT.apk
          cp APK-SHA256-v7.2.0.txt dist/flutter-v7.2.0/APK-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Herbal-ERP-v7.2.0-UAT
          path: |
            dist/flutter-v7.2.0/Excel-Herbal-ERP-v7.2.0-UAT.apk
            dist/flutter-v7.2.0/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit APK to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/flutter-v7.2.0/Excel-Herbal-ERP-v7.2.0-UAT.apk dist/flutter-v7.2.0/APK-SHA256.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Flutter v7.2.0 UAT APK [skip ci]"
          git push origin HEAD:flutter-v720-build
