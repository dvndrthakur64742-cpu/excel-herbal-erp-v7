name: EH7 Entity Workspaces Validation

on:
  push:
    branches: [v740-entity-workspaces]
    paths:
      - 'ci/entity-workspace-trigger.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply entity workspace patch
        run: python3 ci/apply_entity_workspaces.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Format intended Dart files
        working-directory: flutter-app
        run: >-
          dart format
          lib/core/entity_relations.dart
          lib/screens/common/entity_workspace_screen.dart
          lib/screens/common/record_detail_screen.dart
          lib/widgets/records_list.dart
          lib/screens/purchase/purchase_screen.dart
          test/entity_relations_test.dart

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore generated tracked files
        shell: bash
        run: |
          set -euo pipefail
          git restore -- flutter-app/android flutter-app/pubspec.lock || true

      - name: Remove one-shot validation machinery
        shell: bash
        run: |
          rm -f ci/apply_entity_workspaces.py
          rm -f ci/entity-workspace-trigger.txt
          rm -f .github/workflows/eh7-entity-workspaces.yml

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            flutter-app/lib/core/entity_relations.dart \
            flutter-app/lib/screens/common/entity_workspace_screen.dart \
            flutter-app/lib/screens/common/record_detail_screen.dart \
            flutter-app/lib/widgets/records_list.dart \
            flutter-app/lib/screens/purchase/purchase_screen.dart \
            flutter-app/test/entity_relations_test.dart
          git add -u -- \
            ci/apply_entity_workspaces.py \
            ci/entity-workspace-trigger.txt \
            .github/workflows/eh7-entity-workspaces.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              'flutter-app/lib/core/entity_relations.dart',
              'flutter-app/lib/screens/common/entity_workspace_screen.dart',
              'flutter-app/lib/screens/common/record_detail_screen.dart',
              'flutter-app/lib/widgets/records_list.dart',
              'flutter-app/lib/screens/purchase/purchase_screen.dart',
              'flutter-app/test/entity_relations_test.dart',
              'ci/apply_entity_workspaces.py',
              'ci/entity-workspace-trigger.txt',
              '.github/workflows/eh7-entity-workspaces.yml',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected staged paths: {unexpected}')
          print('Validated staged paths:', sorted(changed))
          PY
          git diff --cached --check -- flutter-app/lib flutter-app/test
          git commit -m 'Add connected entity workspaces'
          git push origin HEAD:v740-entity-workspaces
