name: EH7 Flutter v7.4.0 Run Finalizer

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - '.github/workflows/eh7-v740-run-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Extract and apply final patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/eh7-v740-finalize-code.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          chunk = source[start:end]
          lines = []
          for line in chunk.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "if old_sold not in text:\n    raise SystemExit('Daily detail sold block not found')\ntext = text.replace(old_sold, new_sold, 1)",
              "if old_sold in text:\n    text = text.replace(old_sold, new_sold, 1)\nelse:\n    print('Daily detail sold block shape changed; applying robust fallback next.')",
          )
          path = Path('/tmp/patch_v740.py')
          path.write_text(script)
          subprocess.run(['python3', '-m', 'py_compile', str(path)], check=True)
          subprocess.run(['python3', str(path)], check=True)

          # Robust sold fallback: patch by structural anchors rather than exact formatting.
          my_work = Path('flutter-app/lib/screens/my_work/my_work_screen.dart')
          text = my_work.read_text()
          if 'final soldRaw =' not in text:
              anchor = text.index("                        ...(((evening['lines'] as List?) ?? const []).map((e) {")
              block_start = text.index('                          final returned =', anchor)
              block_end = text.index('                          return Padding(', block_start)
              replacement = """                          final returned = num.tryParse(\n                                  '${l['return_quantity'] ?? l['return_qty'] ?? 0}') ??\n                              0;\n                          final issued = num.tryParse(\n                                  '${l['issued_quantity'] ?? 0}') ??\n                              0;\n                          final soldRaw = l['sold_quantity'] ?? l['sold_qty'];\n                          final calculatedSold = issued - returned;\n                          final sold = soldRaw == null\n                              ? (calculatedSold > 0 ? calculatedSold : 0)\n                              : (num.tryParse('$soldRaw') ??\n                                  (calculatedSold > 0 ? calculatedSold : 0));\n"""
              text = text[:block_start] + replacement + text[block_end:]
              my_work.write_text(text)
          PY

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Format
        working-directory: flutter-app
        run: dart format lib test

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Commit canonical v7.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter-app
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Flutter v7.4.0 Daily Order UX and business logic'
          git push origin HEAD:flutter-v720-build
