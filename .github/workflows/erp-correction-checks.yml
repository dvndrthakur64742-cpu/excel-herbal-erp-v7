          if (-not (Test-Path -LiteralPath $main -PathType Leaf)) { throw 'Controlled UAT web main.dart.js was not generated.' }
          if (-not (Select-String -LiteralPath $main -SimpleMatch $apiBase -Quiet)) { throw 'Controlled UAT API base URL is missing from compiled web output.' }

          $root = (Resolve-Path 'build/web').Path
