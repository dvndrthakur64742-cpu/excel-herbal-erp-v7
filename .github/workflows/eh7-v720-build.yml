name: EH7 Flutter v7.3.0 Brand Build

on:
  push:
    branches: [flutter-v720-build]
    paths:
      - 'build-input/flutter-v730-brand-small.parts/**'
      - 'build-input/flutter-v730-analyzer-fix.parts/**'
      - '.github/workflows/eh7-v720-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Reconstruct canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/source.xz.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 15
          cat dist/source.xz.parts/part-*.b64 | base64 -d > /tmp/eh7-clean10.tar.xz
          echo "b89b034254702f81b514c08995d3edc345947852b48f43fea4bd6e89e9c13c0a  /tmp/eh7-clean10.tar.xz" | sha256sum -c -
          rm -rf work
          mkdir work
          tar -xJf /tmp/eh7-clean10.tar.xz -C work

      - name: Apply canonical compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          cd work
          patch -p1 --forward --batch < ../ci/clean10-flutter-compile-fix-1.patch
          python3 ../ci/clean10-analyzer-cleanup-2.py

      - name: Apply v7.2.0 recovered app baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-input/flutter-v720.parts3 -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 6
          cat build-input/flutter-v720.parts3/part-*.b64 | base64 -d > /tmp/flutter-v720-overlay.tar.xz
          echo "8c446ef6a7c66575fb29089535eecd74d2ec9996c3effc56cebd47cd5fdb1e62  /tmp/flutter-v720-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-overlay.tar.xz -C work

          test "$(find build-input/flutter-v720-missing.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 3
          cat build-input/flutter-v720-missing.parts/part-*.b64 | base64 -d > /tmp/flutter-v720-missing-delta.tar.xz
          echo "f2b77954d97d373b6f39d5a10ebca33ffabde05efba866723157aceb1a7d9a4c  /tmp/flutter-v720-missing-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-missing-delta.tar.xz -C work

          base64 -d build-input/flutter-v720-record-detail.b64 > /tmp/flutter-v720-record-detail-delta.tar.xz
          echo "7dbfe5194ee26dc799d2682bfe49c7d55809a5bf352208e8f11ae24200aa225e  /tmp/flutter-v720-record-detail-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v720-record-detail-delta.tar.xz -C work

      - name: Apply Excel Herbal v7.3.0 brand polish
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-input/flutter-v730-brand-small.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 11
          cat build-input/flutter-v730-brand-small.parts/part-*.b64 | base64 -d > /tmp/flutter-v730-brand-small.tar.xz
          echo "942d426faed11fd98120b07f294da8fd0da0abd8b8b1a7338030b10a5b16c534  /tmp/flutter-v730-brand-small.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v730-brand-small.tar.xz -C work
          grep -q "version: 7.3.0+730" work/flutter/excel_herbal_erp/pubspec.yaml
          test -f work/flutter/excel_herbal_erp/assets/branding/excel-herbal-logo.webp
          test -f work/flutter/excel_herbal_erp/lib/theme/excel_brand.dart
          test -f work/flutter/excel_herbal_erp/lib/core/ui_error.dart
          grep -q "'source': 'duty'" work/flutter/excel_herbal_erp/lib/core/gps_tracking_service.dart

      - name: Apply v7.3.0 analyzer compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-input/flutter-v730-analyzer-fix.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 2
          cat build-input/flutter-v730-analyzer-fix.parts/part-*.b64 | base64 -d > /tmp/flutter-v730-analyzer-fix.tar.xz
          echo "88e1af8322d038fdd9f68f501c480727129515945f5d50a0e0aa1c99faeb7d47  /tmp/flutter-v730-analyzer-fix.tar.xz" | sha256sum -c -
          tar -xJf /tmp/flutter-v730-analyzer-fix.tar.xz -C work
          grep -q "this.recordType" work/flutter/excel_herbal_erp/lib/widgets/records_list.dart
          ! grep -q "Drawer _mobileDrawer(AppState app) {$" work/flutter/excel_herbal_erp/lib/shell/app_shell.dart || true

      - name: Bootstrap Android wrapper
        working-directory: work
        run: ./tool/bootstrap_android_wrapper.sh

      - name: Dependencies
        working-directory: work/flutter/excel_herbal_erp
        run: flutter pub get

      - name: Analyze
        working-directory: work/flutter/excel_herbal_erp
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: work/flutter/excel_herbal_erp
        run: flutter test

      - name: Build branded UAT APK
        working-directory: work/flutter/excel_herbal_erp
        run: >-
          flutter build apk --debug
          --build-name=7.3.0
          --build-number=730
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=work/flutter/excel_herbal_erp/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          mkdir -p dist/flutter-v7.3.0
          cp "$APK" dist/flutter-v7.3.0/Excel-Herbal-ERP-v7.3.0-Brand-UAT.apk
          sha256sum dist/flutter-v7.3.0/Excel-Herbal-ERP-v7.3.0-Brand-UAT.apk | tee dist/flutter-v7.3.0/APK-SHA256.txt

      - name: Publish branded APK as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v7.3.0-brand-uat
          APK=dist/flutter-v7.3.0/Excel-Herbal-ERP-v7.3.0-Brand-UAT.apk
          HASH=dist/flutter-v7.3.0/APK-SHA256.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$HASH" --clobber
          else
            gh release create "$TAG" "$APK" "$HASH" \
              --target "$GITHUB_SHA" \
              --title "Excel Herbal ERP Flutter v7.3.0 Brand UAT" \
              --notes "Excel Herbal branded professional UI build. Green/black/white design system, branded login/home/drawer, professional error states, improved Daily Order and Issue Stock UX, GPS source correction. Flutter analyze/test/APK build verified by CI."
          fi

      - name: Commit APK hash to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p release-manifests/v7.3.0
          cp dist/flutter-v7.3.0/APK-SHA256.txt release-manifests/v7.3.0/APK-SHA256.txt
          git add release-manifests/v7.3.0/APK-SHA256.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Flutter v7.3.0 brand APK hash [skip ci]"
          git push origin HEAD:flutter-v720-build
