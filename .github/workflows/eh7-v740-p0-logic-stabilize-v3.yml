name: EH7 v7.4 P0 Logic Stabilization v3

on:
  push:
    branches: [v740-p0-logic-stabilization]
    paths:
      - 'ci/p0-v3-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v740-p0-logic-stabilization
          fetch-depth: 0

      - name: Apply P0 logic patch
        run: python3 ci/run_p0_logic_stabilize_v3.py

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format new policy and tests only
        working-directory: flutter-app
        run: >-
          dart format
          lib/core/daily_order_math.dart
          lib/core/daily_order_workflow.dart
          lib/core/stock_allocation.dart
          test/daily_order_math_test.dart
          test/daily_order_workflow_test.dart
          test/stock_allocation_test.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: >-
          flutter build apk --debug
          --build-name=7.4.0
          --build-number=740
          --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7
          --dart-define=EH7_ENVIRONMENT=uat

      - name: Restore build-generated tracked files
        run: |
          git restore -- flutter-app/android flutter-app/pubspec.lock || true

      - name: Remove one-shot patch machinery
        run: |
          rm -f ci/p0_logic_stabilize.py
          rm -f ci/run_p0_logic_stabilize_v2.py
          rm -f ci/run_p0_logic_stabilize_v3.py
          rm -f ci/p0-v3-trigger.txt
          rm -f .github/workflows/eh7-v740-p0-logic-stabilize.yml
          rm -f .github/workflows/eh7-v740-p0-logic-stabilize-v2.yml
          rm -f .github/workflows/eh7-v740-p0-logic-stabilize-v3.yml
          rmdir ci 2>/dev/null || true

      - name: Commit validated P0 stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            flutter-app/lib/core/daily_order_math.dart \
            flutter-app/lib/core/daily_order_workflow.dart \
            flutter-app/lib/core/stock_allocation.dart \
            flutter-app/lib/screens/finance/finance_screen.dart \
            flutter-app/lib/screens/home/home_screen.dart \
            flutter-app/lib/screens/my_work/my_work_screen.dart \
            flutter-app/lib/screens/organization/organization_screen.dart \
            flutter-app/lib/screens/organization/team_screen.dart \
            flutter-app/lib/screens/performance/performance_screen.dart \
            flutter-app/test/daily_order_math_test.dart \
            flutter-app/test/daily_order_workflow_test.dart \
            flutter-app/test/stock_allocation_test.dart

          git add -u -- ci .github/workflows
          git diff --cached --check -- flutter-app/lib flutter-app/test

          python3 - <<'PY'
          import subprocess
          allowed = {
              'flutter-app/lib/core/daily_order_math.dart',
              'flutter-app/lib/core/daily_order_workflow.dart',
              'flutter-app/lib/core/stock_allocation.dart',
              'flutter-app/lib/screens/finance/finance_screen.dart',
              'flutter-app/lib/screens/home/home_screen.dart',
              'flutter-app/lib/screens/my_work/my_work_screen.dart',
              'flutter-app/lib/screens/organization/organization_screen.dart',
              'flutter-app/lib/screens/organization/team_screen.dart',
              'flutter-app/lib/screens/performance/performance_screen.dart',
              'flutter-app/test/daily_order_math_test.dart',
              'flutter-app/test/daily_order_workflow_test.dart',
              'flutter-app/test/stock_allocation_test.dart',
              'ci/p0_logic_stabilize.py',
              'ci/run_p0_logic_stabilize_v2.py',
              'ci/run_p0_logic_stabilize_v3.py',
              'ci/p0-v3-trigger.txt',
              '.github/workflows/eh7-v740-p0-logic-stabilize.yml',
              '.github/workflows/eh7-v740-p0-logic-stabilize-v2.yml',
              '.github/workflows/eh7-v740-p0-logic-stabilize-v3.yml',
          }
          names = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          unexpected = sorted(set(names) - allowed)
          if unexpected:
              raise SystemExit('Unexpected staged paths: ' + ', '.join(unexpected))
          print('Validated commit scope:', len(names), 'paths')
          PY

          git commit -m "Stabilize v7.4 P0 workflow logic"
          git push origin HEAD:v740-p0-logic-stabilization
