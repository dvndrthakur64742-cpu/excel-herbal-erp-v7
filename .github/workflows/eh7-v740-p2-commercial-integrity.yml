name: EH7 v7.4 P2 Commercial Integrity

on:
  push:
    branches: [v740-p2-commercial-integrity]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/eh7-v740-p2-commercial-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch product commercial UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter-app/lib/screens/organization/organization_screen.dart')
          s = p.read_text()
          imp = "import '../../core/api_paths.dart';\n"
          if "../../core/commercial_integrity.dart" not in s:
              s = s.replace(imp, imp + "import '../../core/commercial_integrity.dart';\n", 1)

          start = s.index('  Future<void> _createProduct() async {')
          end = s.index('\n\n  void _productActions', start)
          create_product = r'''  Future<void> _createProduct() async {
            final sku = TextEditingController();
            final name = TextEditingController();
            final uom = TextEditingController(text: 'PCS');
            final mrp = TextEditingController(text: '0');
            final sale = TextEditingController(text: '0');
            final ho = TextEditingController(text: '0');
            final bm = TextEditingController(text: '0');
            final salary = TextEditingController(text: '0');
            final office = TextEditingController(text: '0');
            final points = TextEditingController(text: '0');
            final purchaseCost = TextEditingController(text: '0');
            final controllers = [
              sku,
              name,
              uom,
              mrp,
              sale,
              ho,
              bm,
              salary,
              office,
              points,
              purchaseCost,
            ];
            var batchMode = 'optional';
            var expiryTracking = false;
            final ok = await showDialog<bool>(
              context: context,
              builder: (context) => StatefulBuilder(
                builder: (context, setLocal) => AlertDialog(
                  title: const Text('New Product'),
                  content: SizedBox(
                    width: 640,
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: sku,
                            decoration: const InputDecoration(labelText: 'SKU'),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: name,
                            decoration: const InputDecoration(labelText: 'Product Name'),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: uom,
                            decoration: const InputDecoration(labelText: 'UOM'),
                          ),
                          const SizedBox(height: 10),
                          DropdownButtonFormField<String>(
                            initialValue: batchMode,
                            decoration: const InputDecoration(labelText: 'Batch Tracking'),
                            items: const [
                              DropdownMenuItem(value: 'off', child: Text('Off')),
                              DropdownMenuItem(value: 'optional', child: Text('Optional')),
                              DropdownMenuItem(value: 'required', child: Text('Required')),
                            ],
                            onChanged: (v) {
                              if (v != null) setLocal(() => batchMode = v);
                            },
                          ),
                          CheckboxListTile(
                            contentPadding: EdgeInsets.zero,
                            value: expiryTracking,
                            title: const Text('Expiry Tracking'),
                            onChanged: (v) => setLocal(() => expiryTracking = v == true),
                          ),
                          _moneyPair(mrp, 'MRP', sale, 'Sale Price'),
                          const SizedBox(height: 10),
                          _moneyPair(ho, 'HO Amount', bm, 'BM Profit'),
                          const SizedBox(height: 10),
                          _moneyPair(salary, 'Salary Fund', office, 'Office Expense'),
                          const SizedBox(height: 10),
                          _moneyPair(points, 'Points', purchaseCost, 'Initial Purchase Cost'),
                          const SizedBox(height: 10),
                          const Align(
                            alignment: Alignment.centerLeft,
                            child: Text('Rule: Sale Price ≤ MRP and distribution total must equal Sale Price.'),
                          ),
                        ],
                      ),
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context, false),
                      child: const Text('Cancel'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(
                        context,
                        sku.text.trim().isNotEmpty && name.text.trim().isNotEmpty,
                      ),
                      child: const Text('Create'),
                    ),
                  ],
                ),
              ),
            );
            if (ok != true) {
              _disposeControllers(controllers);
              return;
            }
            try {
              final commercial = _commercialValues(
                mrp: mrp,
                sale: sale,
                ho: ho,
                bm: bm,
                salary: salary,
                office: office,
                points: points,
                purchaseCost: purchaseCost,
              );
              final payload = {
                'sku': sku.text.trim(),
                'name': name.text.trim(),
                'uom': uom.text.trim(),
                'batch_tracking': batchMode,
                'expiry_tracking': expiryTracking,
                ...commercial.toPayload(),
              };
              await ref.read(apiClientProvider).post(ApiPaths.products, data: payload);
              if (mounted) {
                setState(() {
                  refresh++;
                  message = 'Product create ho gaya.';
                });
              }
            } catch (e) {
              if (mounted) setState(() => message = UiError.message(e));
            } finally {
              _disposeControllers(controllers);
            }
          }'''
          s = s[:start] + create_product + s[end:]

          start = s.index('  Future<void> _commercialRevision(Map<String, dynamic> product) async {')
          end = s.index('\n\n  Widget _moneyPair', start)
          revision = r'''  Future<void> _commercialRevision(Map<String, dynamic> product) async {
            final closed = await OverlayTransition.closeAndSettle(context);
            if (!closed || !mounted) return;
            final app = ref.read(appStateProvider);
            try {
              final history =
                  (await ref
                              .read(apiClientProvider)
                              .get(ApiPaths.productHistory(int.parse('${product['id']}')))
                          as List)
                      .map((e) => Map<String, dynamic>.from(e as Map))
                      .toList();
              if (!mounted) return;
              final latest = history.isNotEmpty ? history.first : product;
              final mrp = TextEditingController(text: '${latest['mrp'] ?? product['mrp'] ?? 0}');
              final sale = TextEditingController(text: '${latest['sale_price'] ?? product['sale_price'] ?? 0}');
              final ho = TextEditingController(text: '${latest['ho_amount'] ?? product['ho_amount'] ?? 0}');
              final bm = TextEditingController(text: '${latest['bm_profit'] ?? product['bm_profit'] ?? 0}');
              final salary = TextEditingController(text: '${latest['salary_fund'] ?? product['salary_fund'] ?? 0}');
              final office = TextEditingController(text: '${latest['office_expense'] ?? product['office_expense'] ?? 0}');
              final points = TextEditingController(text: '${latest['points'] ?? product['points'] ?? 0}');
              final purchaseCost = TextEditingController(text: '${latest['purchase_cost'] ?? product['purchase_cost'] ?? 0}');
              final effectiveDate = TextEditingController(text: app.businessDate);
              final reason = TextEditingController();
              final controllers = [
                mrp,
                sale,
                ho,
                bm,
                salary,
                office,
                points,
                purchaseCost,
                effectiveDate,
                reason,
              ];
              final ok = await showDialog<bool>(
                context: context,
                builder: (context) => AlertDialog(
                  title: Text('Commercial Revision · ${product['name']}'),
                  content: SizedBox(
                    width: 640,
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          _moneyPair(mrp, 'MRP', sale, 'Sale Price'),
                          const SizedBox(height: 10),
                          _moneyPair(ho, 'HO Amount', bm, 'BM Profit'),
                          const SizedBox(height: 10),
                          _moneyPair(salary, 'Salary Fund', office, 'Office Expense'),
                          const SizedBox(height: 10),
                          _moneyPair(points, 'Points', purchaseCost, 'Purchase Cost'),
                          const SizedBox(height: 10),
                          TextField(
                            controller: effectiveDate,
                            decoration: const InputDecoration(
                              labelText: 'Effective Date YYYY-MM-DD',
                              helperText: 'Default ERP business date',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: reason,
                            minLines: 2,
                            maxLines: 4,
                            decoration: const InputDecoration(labelText: 'Change Reason'),
                          ),
                          const SizedBox(height: 10),
                          const Align(
                            alignment: Alignment.centerLeft,
                            child: Text('Rule: Sale Price ≤ MRP and HO + BM + Salary Fund + Office Expense = Sale Price.'),
                          ),
                        ],
                      ),
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context, false),
                      child: const Text('Cancel'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(
                        context,
                        reason.text.trim().length >= 5 &&
                            CommercialIntegrity.validBusinessDate(effectiveDate.text),
                      ),
                      child: const Text('Save Revision'),
                    ),
                  ],
                ),
              );
              if (ok != true) {
                _disposeControllers(controllers);
                return;
              }
              try {
                if (!CommercialIntegrity.validBusinessDate(effectiveDate.text)) {
                  throw Exception('Effective Date valid YYYY-MM-DD format me honi chahiye.');
                }
                final commercial = _commercialValues(
                  mrp: mrp,
                  sale: sale,
                  ho: ho,
                  bm: bm,
                  salary: salary,
                  office: office,
                  points: points,
                  purchaseCost: purchaseCost,
                );
                await ref.read(apiClientProvider).post(
                  ApiPaths.productRevision(int.parse('${product['id']}')),
                  data: {
                    ...commercial.toPayload(),
                    'effective_from': '${effectiveDate.text.trim()} 00:00:00',
                    'reason': reason.text.trim(),
                  },
                );
                if (mounted) {
                  setState(() {
                    refresh++;
                    message = 'Commercial revision saved.';
                  });
                }
              } finally {
                _disposeControllers(controllers);
              }
            } catch (e) {
              if (mounted) setState(() => message = UiError.message(e));
            }
          }

          CommercialValues _commercialValues({
            required TextEditingController mrp,
            required TextEditingController sale,
            required TextEditingController ho,
            required TextEditingController bm,
            required TextEditingController salary,
            required TextEditingController office,
            required TextEditingController points,
            required TextEditingController purchaseCost,
          }) {
            final parsedMrp = CommercialIntegrity.parseRequired(mrp.text);
            final parsedSale = CommercialIntegrity.parseRequired(sale.text);
            final parsedHo = CommercialIntegrity.parseRequired(ho.text);
            final parsedBm = CommercialIntegrity.parseRequired(bm.text);
            final parsedSalary = CommercialIntegrity.parseRequired(salary.text);
            final parsedOffice = CommercialIntegrity.parseRequired(office.text);
            final parsedPoints = CommercialIntegrity.parseRequired(points.text);
            final parsedPurchase = CommercialIntegrity.parseRequired(purchaseCost.text);
            final error = CommercialIntegrity.validate(
              mrp: parsedMrp,
              salePrice: parsedSale,
              hoAmount: parsedHo,
              bmProfit: parsedBm,
              salaryFund: parsedSalary,
              officeExpense: parsedOffice,
              points: parsedPoints,
              purchaseCost: parsedPurchase,
            );
            if (error != null) throw Exception(error);
            return CommercialIntegrity.values(
              mrp: parsedMrp!,
              salePrice: parsedSale!,
              hoAmount: parsedHo!,
              bmProfit: parsedBm!,
              salaryFund: parsedSalary!,
              officeExpense: parsedOffice!,
              points: parsedPoints!,
              purchaseCost: parsedPurchase!,
            );
          }

          void _disposeControllers(Iterable<TextEditingController> controllers) {
            for (final controller in controllers) {
              controller.dispose();
            }
          }'''
          s = s[:start] + revision + s[end:]
          s = s.replace("\n\n  double _num(TextEditingController c) => double.tryParse(c.text.trim()) ?? 0;", "")
          p.write_text(s)
          PY

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Format changed files
        working-directory: flutter-app
        run: dart format lib/core/commercial_integrity.dart lib/screens/organization/organization_screen.dart test/commercial_integrity_test.dart

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK validation
        working-directory: flutter-app
        run: flutter build apk --debug

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/eh7-v740-p2-commercial-integrity.yml

      - name: Commit validated P2 commercial integrity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter-app .github/workflows/eh7-v740-p2-commercial-integrity.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Harden product commercial master integrity'
            git push origin HEAD:v740-p2-commercial-integrity
          fi
