name: EH7 Flutter v7.4.0 Stabilization Build

on:
  workflow_dispatch:
  push:
    branches: [v7-hierarchy-gps-reporting-dashboard]
    paths:
      - '.github/workflows/eh7-v740-stabilization-build.yml'

concurrency:
  group: eh7-v740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bootstrap Python 3.12
        run: |
          set PYZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip
          set PYDIR=%RUNNER_TEMP%\python-3.12.10-embed
          if exist "%PYDIR%" rmdir /s /q "%PYDIR%"
          curl.exe -fL --retry 3 --retry-delay 2 "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -o "%PYZIP%"
          mkdir "%PYDIR%"
          tar.exe -xf "%PYZIP%" -C "%PYDIR%"
          echo %PYDIR%>>"%GITHUB_PATH%"
          "%PYDIR%\python.exe" --version

      - name: Verify hierarchy/reporting/GPS frontend invariants
        working-directory: flutter-app
        run: python tool\finalize_hierarchy_gps_frontend.py

      - name: Verify branch selector state sync
        working-directory: flutter-app
        run: python tool\verify_branch_selector_state_sync.py

      - name: Verify Flutter API paths against v7 backend
        working-directory: flutter-app
        run: python tool\verify_api_paths_against_backend.py

      - name: Bootstrap JDK 17
        run: |
          set JDKZIP=%RUNNER_TEMP%\jdk17.zip
          set JDKROOT=%RUNNER_TEMP%\jdk17
          if exist "%JDKROOT%" rmdir /s /q "%JDKROOT%"
          mkdir "%JDKROOT%"
          curl.exe -fL --retry 3 --retry-delay 2 "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk" -o "%JDKZIP%"
          tar.exe -xf "%JDKZIP%" -C "%JDKROOT%"
          for /d %%D in ("%JDKROOT%\*") do echo JAVA_HOME=%%~fD>>"%GITHUB_ENV%"
          for /d %%D in ("%JDKROOT%\*") do echo %%~fD\bin>>"%GITHUB_PATH%"
          for /d %%D in ("%JDKROOT%\*") do "%%~fD\bin\java.exe" -version

      - name: Bootstrap Android SDK command-line tools
        run: |
          set SDK=%RUNNER_TEMP%\android-sdk
          set SDKZIP=%RUNNER_TEMP%\commandlinetools-win-15859902_latest.zip
          if exist "%SDK%" rmdir /s /q "%SDK%"
          mkdir "%SDK%"
          curl.exe -fL --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip" -o "%SDKZIP%"
          certutil -hashfile "%SDKZIP%" SHA256 | findstr /i "90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a" >nul
          if errorlevel 1 exit /b 1
          tar.exe -xf "%SDKZIP%" -C "%SDK%"
          mkdir "%SDK%\cmdline-tools\latest"
          move "%SDK%\cmdline-tools\bin" "%SDK%\cmdline-tools\latest\bin"
          move "%SDK%\cmdline-tools\lib" "%SDK%\cmdline-tools\latest\lib"
          move "%SDK%\cmdline-tools\NOTICE.txt" "%SDK%\cmdline-tools\latest\NOTICE.txt"
          move "%SDK%\cmdline-tools\source.properties" "%SDK%\cmdline-tools\latest\source.properties"
          echo ANDROID_HOME=%SDK%>>"%GITHUB_ENV%"
          echo ANDROID_SDK_ROOT=%SDK%>>"%GITHUB_ENV%"
          echo %SDK%\cmdline-tools\latest\bin>>"%GITHUB_PATH%"
          echo %SDK%\platform-tools>>"%GITHUB_PATH%"

      - name: Accept Android licenses and install SDK packages
        run: |
          (for /l %%i in (1,1,100) do @echo y) | sdkmanager.bat --licenses
          sdkmanager.bat "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Bootstrap Flutter 3.44.9 stable
        run: |
          set FLUTTERZIP=%RUNNER_TEMP%\flutter_windows_3.44.9-stable.zip
          set FLUTTERROOT=%RUNNER_TEMP%\flutter-3.44.9
          if exist "%FLUTTERROOT%" rmdir /s /q "%FLUTTERROOT%"
          mkdir "%FLUTTERROOT%"
          curl.exe -fL --retry 3 --retry-delay 2 "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.9-stable.zip" -o "%FLUTTERZIP%"
          tar.exe -xf "%FLUTTERZIP%" -C "%FLUTTERROOT%"
          git config --global --add safe.directory "%FLUTTERROOT%\flutter"
          echo %FLUTTERROOT%\flutter\bin>>"%GITHUB_PATH%"
          "%FLUTTERROOT%\flutter\bin\flutter.bat" --version
          "%FLUTTERROOT%\flutter\bin\flutter.bat" config --no-analytics

      - name: Verify Flutter toolchain
        run: |
          flutter.bat --version
          flutter.bat doctor -v

      - name: Dependencies
        working-directory: flutter-app
        run: flutter.bat pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter.bat analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: flutter-app
        run: flutter.bat test

      - name: Build APK
        working-directory: flutter-app
        run: flutter.bat build apk --debug --build-name=7.4.0 --build-number=740 --dart-define=EH7_API_BASE_URL=https://office.excelherbal.in/wp-json/excel-herbal-erp/v7 --dart-define=EH7_ENVIRONMENT=uat

      - name: Verify APK and SHA256
        run: |
          if not exist "flutter-app\build\app\outputs\flutter-apk\app-debug.apk" exit /b 1
          if not exist "dist\flutter-v7.4.0" mkdir "dist\flutter-v7.4.0"
          copy /y "flutter-app\build\app\outputs\flutter-apk\app-debug.apk" "dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk"
          for %%A in ("dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk") do if %%~zA LEQ 0 exit /b 1
          certutil -hashfile "dist\flutter-v7.4.0\Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk" SHA256 > "dist\flutter-v7.4.0\APK-SHA256.txt"
          type "dist\flutter-v7.4.0\APK-SHA256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Excel-Herbal-ERP-v7.4.0-Stabilization-UAT
          path: |
            dist/flutter-v7.4.0/Excel-Herbal-ERP-v7.4.0-Stabilization-UAT.apk
            dist/flutter-v7.4.0/APK-SHA256.txt
          if-no-files-found: error
