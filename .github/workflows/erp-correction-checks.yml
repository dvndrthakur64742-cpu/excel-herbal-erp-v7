            '8. PR remains draft; this bundle is not production approval.'
          ) | Set-Content -LiteralPath (Join-Path $payload 'DEPLOY-INSTRUCTIONS.txt') -Encoding utf8
          foreach ($required in @(
            (Join-Path $plugin 'excel-herbal-erp-v7.php'),
            (Join-Path $plugin 'build-meta.php'),
            (Join-Path $plugin 'src\Core\Autoloader.php'),
            (Join-Path $web 'index.html'),
            (Join-Path $web 'main.dart.js'),
            (Join-Path $web 'flutter_bootstrap.js'),
            (Join-Path $web 'SHA256SUMS.txt')
          )) { if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw ('Final bundle missing required file: ' + $required) } }
          $desktopRoot = Join-Path $env:USERPROFILE ('Desktop\EH7-UAT-Final\' + $env:GITHUB_SHA)
          if (Test-Path -LiteralPath $desktopRoot) { Remove-Item -LiteralPath $desktopRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $desktopRoot -Force | Out-Null
          $zipPath = Join-Path $desktopRoot 'EH7-UAT-Final-Bundle.zip'
          $root = (Resolve-Path -LiteralPath $payload).Path
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath,[System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -LiteralPath $payload -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart([char[]]@([char]92,[char]47))
              $entryName = $relative -replace '\\','/'
              $entry = $archive.CreateEntry($entryName,[System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              $fileStream = [System.IO.File]::OpenRead($_.FullName)
              try { $fileStream.CopyTo($entryStream) }
              finally { $fileStream.Dispose(); $entryStream.Dispose() }
            }
          } finally { $archive.Dispose() }
          $verify = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($verify.Entries | ForEach-Object { $_.FullName })
            if ($names | Where-Object { $_.Contains([char]92) }) { throw 'Final bundle contains Windows backslash entries.' }
            foreach ($required in @(
              'plugin/excel-herbal-erp-v7/excel-herbal-erp-v7.php',
              'plugin/excel-herbal-erp-v7/build-meta.php',
              'plugin/excel-herbal-erp-v7/src/Core/Autoloader.php',
              'web/eh7-flutter-web/index.html',
              'web/eh7-flutter-web/main.dart.js',
              'FINAL-MANIFEST.txt',
              'DEPLOY-INSTRUCTIONS.txt'
            )) { if ($names -notcontains $required) { throw ('Final bundle ZIP missing required entry: ' + $required) } }
          } finally { $verify.Dispose() }
          $bundleHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$bundleHash  EH7-UAT-Final-Bundle.zip" | Set-Content -LiteralPath (Join-Path $desktopRoot 'FINAL-BUNDLE-SHA256.txt') -Encoding ascii
          Copy-Item -LiteralPath (Join-Path $payload 'FINAL-MANIFEST.txt') -Destination $desktopRoot -Force
          Write-Host "FINAL_BUNDLE_DIR=$desktopRoot"
          Write-Host "FINAL_BUNDLE_SHA256=$bundleHash"
          Remove-Item -LiteralPath $work -Recurse -Force

  uat-daily-order-integrity-smoke:
    if: github.ref == 'refs/heads/codex/erp735-document-integration' && contains(github.event.head_commit.message, '[uat-daily-order]')
